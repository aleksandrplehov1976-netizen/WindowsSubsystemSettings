<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Черный экран · видео активация</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      padding: 16px 12px 20px;
    }

    .top-off {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.8rem;
      font-weight: 400;
      cursor: pointer;
      padding: 6px 12px;
      margin-bottom: 8px;
      align-self: center;
      opacity: 0.9;
      transition: opacity 0.2s;
      letter-spacing: 0.5px;
      font-family: inherit;
      z-index: 10;
    }
    .top-off:hover {
      opacity: 1;
    }

    .video-stage {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      pointer-events: none;
    }

    .video-stage video {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: block;
      width: 200px;
      height: 200px;
      object-fit: contain;
      background: transparent;
      pointer-events: none;
      border: none;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      box-shadow: none;
      opacity: 0;
      visibility: hidden;
    }

    .video-stage video.visible {
      visibility: visible;
      opacity: 1;
    }

    .video-stage video.fade-in {
      visibility: visible;
      opacity: 0;
      transition: opacity 1.7s ease;
    }

    .video-stage video.fade-in-active {
      visibility: visible;
      opacity: 1;
    }

    .video-stage video.fade-out {
      visibility: visible;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .bottom-activate {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.8rem;
      font-weight: 400;
      cursor: pointer;
      padding: 6px 12px;
      margin-top: 8px;
      align-self: center;
      opacity: 0.9;
      transition: opacity 0.2s;
      letter-spacing: 0.5px;
      font-family: inherit;
      z-index: 10;
    }
    .bottom-activate:hover {
      opacity: 1;
    }

    button {
      background: transparent;
      border: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible {
      outline: none;
    }

    @media (max-width: 480px) {
      .video-stage video {
        width: 150px;
        height: 150px;
      }
      .top-off, .bottom-activate {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <button class="top-off" id="offBtn">Off</button>

  <div class="video-stage" id="videoStage"></div>

  <button class="bottom-activate" id="activateBtn">Activate</button>

  <script>
    (function() {
      const videoStage = document.getElementById('videoStage');
      const activateBtn = document.getElementById('activateBtn');
      const offBtn = document.getElementById('offBtn');

      const BASE_URL = 'https://perec4iv.beget.tech/siriext/';
      const FIRST_VIDEO = BASE_URL + '1790618271.MP4';
      const SECOND_VIDEO = BASE_URL + '1790618830.MP4';

      let videoA = null;
      let videoB = null;
      let activeVideo = null;
      let isActive = false;

      function createVideo(src, loop) {
        const v = document.createElement('video');
        v.src = src;
        v.controls = false;
        v.autoplay = false;
        v.playsInline = true;
        v.preload = 'auto';
        v.loop = loop;
        v.muted = false;
        v.crossOrigin = 'anonymous';
        v.disablePictureInPicture = true;
        v.setAttribute('disablePictureInPicture', '');
        v.setAttribute('controlsList', 'nodownload nofullscreen noremoteplayback');
        return v;
      }

      function init() {
        if (videoA) return;

        videoA = createVideo(FIRST_VIDEO, false);
        videoB = createVideo(SECOND_VIDEO, true);

        videoStage.appendChild(videoA);
        videoStage.appendChild(videoB);

        videoA.addEventListener('ended', onFirstEnded);
      }

      function safePlay(v) {
        const p = v.play();
        if (p !== undefined) {
          p.catch(() => {
            v.muted = true;
            v.play().catch(() => {});
          });
        }
      }

      function activate() {
        init();

        isActive = true;

        videoA.pause();
        videoB.pause();

        videoA.currentTime = 0;
        videoB.currentTime = 0;

        videoA.className = '';
        videoB.className = '';

        videoA.classList.add('fade-in');
        videoB.classList.remove('fade-in', 'fade-in-active', 'visible', 'fade-out');

        activeVideo = videoA;

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            videoA.classList.add('fade-in-active');
          });
        });

        safePlay(videoA);

        videoB.preload = 'auto';
        if (videoB.readyState < 3) {
          videoB.load();
        }
      }

      function onFirstEnded() {
        if (!isActive) return;

        videoB.currentTime = 0;
        safePlay(videoB);

        videoA.className = '';
        videoA.style.visibility = 'hidden';
        videoA.style.opacity = '0';

        videoB.className = '';
        videoB.classList.add('visible');

        activeVideo = videoB;
      }

      function fadeOutAndStop() {
        if (!isActive && !activeVideo) return;

        isActive = false;

        const target = activeVideo;
        if (!target) return;

        videoA.pause();
        videoB.pause();

        target.className = '';
        target.classList.add('fade-out');

        setTimeout(() => {
          videoA.className = '';
          videoB.className = '';
          videoA.style.visibility = 'hidden';
          videoA.style.opacity = '0';
          videoB.style.visibility = 'hidden';
          videoB.style.opacity = '0';
          activeVideo = null;
        }, 500);
      }

      activateBtn.addEventListener('click', activate);
      offBtn.addEventListener('click', fadeOutAndStop);
    })();
  </script>
</body>
</html>
