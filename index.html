<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Новости</title>
    <style>
        /* ===== СБРОС ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            padding: 0;
            margin: 0;
        }
        button {
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
        }
        button:active {
            opacity: 0.6;
        }

        /* ===== ШАПКА ===== */
        .main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border-bottom: 1px solid #d0d0d0;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .main-header h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #1a1a1a;
        }
        .refresh-btn {
            font-size: 18px;
            color: #1a1a1a;
            padding: 4px 8px;
        }

        /* ===== ПРЕДУПРЕЖДЕНИЕ ===== */
        .drone-alert {
            background: #fff3cd;
            border-bottom: 1px solid #e5e5e5;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 500;
            color: #856404;
            display: none;
        }
        .drone-alert.active {
            display: block;
        }

        /* ===== ПЛИТКИ ===== */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            background: #d0d0d0;
            margin: 0;
            padding: 0;
        }
        .tile {
            background: #ffffff;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .tile-img-wrap {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            background: #e5e5e5;
        }
        .tile-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .tile-title {
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.3;
            position: relative;
            z-index: 2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== СПИСОК ===== */
        .news-list {
            padding: 0;
            margin: 0;
        }
        .list-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-bottom: 1px solid #e5e5e5;
            cursor: pointer;
            background: #ffffff;
        }
        .list-item:active {
            background: #f0f0f0;
        }
        .list-item .list-title {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.3;
            color: #1a1a1a;
            flex: 1;
        }
        .list-img-wrap {
            width: 80px;
            height: 80px;
            flex-shrink: 0;
            overflow: hidden;
            background: #e5e5e5;
            order: 2;
        }
        .list-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ===== ДЕТАЛЬНЫЙ ЭКРАН ===== */
        .detail-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 1000;
            overflow-y: auto;
            padding: 0;
            margin: 0;
        }
        .detail-screen.active {
            display: block;
        }
        .detail-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #ffffff;
            border-bottom: 1px solid #d0d0d0;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .detail-header .back-btn {
            font-size: 28px;
            font-weight: 300;
            line-height: 1;
            color: #1a1a1a;
            padding: 0 4px;
        }
        .detail-header .detail-title {
            font-size: 18px;
            font-weight: 500;
            color: #1a1a1a;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .detail-content {
            padding: 16px 20px 40px;
        }
        .detail-img-wrap {
            width: 100%;
            max-height: 300px;
            overflow: hidden;
            background: #e5e5e5;
            margin-bottom: 16px;
        }
        .detail-img-wrap img {
            width: 100%;
            height: 100%;
            max-height: 300px;
            object-fit: cover;
            display: block;
        }
        .detail-headline {
            font-size: 22px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 12px;
            color: #1a1a1a;
        }
        .detail-body {
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 16px;
            line-height: 1.6;
            color: #222;
            margin-bottom: 20px;
        }

        /* ===== ЛАЙК ===== */
        .like-container {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-top: 1px solid #e5e5e5;
            border-bottom: 1px solid #e5e5e5;
            margin-bottom: 24px;
        }
        .like-btn {
            font-size: 16px;
            font-weight: 500;
            color: #1a1a1a;
            border: 1px solid #1a1a1a;
            padding: 6px 16px;
            min-width: 100px;
            text-align: center;
        }
        .like-btn.liked {
            background: #1a1a1a;
            color: #ffffff;
        }
        .like-count {
            font-size: 14px;
            color: #555;
        }

        /* ===== КОММЕНТАРИИ ===== */
        .comments-section {
            margin-top: 12px;
        }
        .comments-title {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }
        .comment-item {
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .comment-item .comment-author {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .comment-item .comment-text {
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 15px;
            color: #222;
            line-height: 1.4;
            margin-top: 4px;
        }
        .comment-item .comment-actions {
            display: flex;
            gap: 16px;
            margin-top: 6px;
            font-size: 13px;
            color: #555;
        }
        .comment-item .comment-actions button {
            background: none;
            border: none;
            color: #555;
            font-size: 13px;
            cursor: pointer;
            padding: 0;
        }
        .comment-item .comment-actions button:active {
            color: #1a1a1a;
        }

        /* ===== ФОРМА КОММЕНТАРИЯ ===== */
        .add-comment-form {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #e5e5e5;
        }
        .add-comment-form .form-title {
            font-size: 15px;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 12px;
        }
        .add-comment-form input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d0d0d0;
            font-size: 15px;
            font-family: inherit;
            background: #ffffff;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .add-comment-form input::placeholder {
            color: #999;
        }
        .add-comment-form .submit-comment {
            padding: 8px 24px;
            background: #1a1a1a;
            color: #ffffff;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 4px;
        }
        .add-comment-form .submit-comment:active {
            opacity: 0.7;
        }

        /* ===== ЗАГРУЗКА ===== */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            gap: 16px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #e5e5e5;
            border-top: 3px solid #1a1a1a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loading-text {
            color: #777;
            font-size: 15px;
        }

        .error {
            text-align: center;
            padding: 40px 20px;
            color: #b00020;
        }
        .error button {
            margin-top: 12px;
            padding: 8px 24px;
            background: #1a1a1a;
            color: #ffffff;
            border: none;
            font-size: 14px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 480px) {
            .tile-title {
                font-size: 11px;
                padding: 4px 6px;
            }
            .list-img-wrap {
                width: 60px;
                height: 60px;
            }
            .detail-headline {
                font-size: 19px;
            }
            .detail-header .detail-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ШАПКА ===== -->
    <div class="main-header">
        <h1>Новости</h1>
        <button class="refresh-btn" id="refreshBtn" title="Обновить новости">⟳</button>
    </div>

    <!-- ===== ПРЕДУПРЕЖДЕНИЕ ===== -->
    <div class="drone-alert" id="droneAlert">
        ⚠️ <span id="droneText">В Москве атака беспилотников продолжается. Берегите себя!</span>
    </div>

    <!-- ===== КОНТЕЙНЕРЫ ===== -->
    <div id="tilesContainer" class="grid-3"></div>
    <div id="listContainer" class="news-list"></div>

    <!-- ===== ДЕТАЛЬНЫЙ ЭКРАН ===== -->
    <div class="detail-screen" id="detailScreen">
        <div class="detail-header">
            <button class="back-btn" id="backBtn">←</button>
            <span class="detail-title" id="detailTitle">Новость</span>
        </div>
        <div class="detail-content" id="detailContent"></div>
    </div>

    <script>
        // ============================================================
        //  КОНФИГУРАЦИЯ
        // ============================================================
        const API_BASE = 'https://script.google.com/macros/s/AKfycbzoUIyPjK6So3sVlM3QCvabCExZLjuqI4Jn_cNlpx_eOjRWbNu-qZYFOw902OjzWKMKFg/exec';
        const DRONE_ALERT_ENABLED = 1;
        const DRONE_ALERT_TEXT = 'В Москве атака беспилотников продолжается. Берегите себя!';

        let allNews = [];
        let currentNews = null;

        // ============================================================
        //  ЗАГРУЗКА НОВОСТЕЙ
        // ============================================================
        async function loadNews() {
            const tiles = document.getElementById('tilesContainer');
            const list = document.getElementById('listContainer');

            tiles.innerHTML = `
                        <div style="grid-column:1/-1;">
                            <div class="loading-container">
                                <div class="spinner"></div>
                                <div class="loading-text">Получаем новости из интернета...</div>
                            </div>
                        </div>
                    `;
            list.innerHTML = '';

            try {
                const url = `${API_BASE}?action=getNews`;
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                if (!data.success || !data.data || data.data.length === 0) {
                    tiles.innerHTML =
                        '<div style="grid-column:1/-1;padding:40px;text-align:center;color:#777;">Новостей пока нет</div>';
                    list.innerHTML = '';
                    return;
                }

                allNews = data.data;
                renderAll(allNews);
            } catch (error) {
                tiles.innerHTML = `
                            <div style="grid-column:1/-1;padding:40px;text-align:center;color:#b00020;">
                                Ошибка: ${error.message}
                                <br><br>
                                <button onclick="loadNews()" style="padding:8px 24px;background:#1a1a1a;color:#fff;border:none;font-size:14px;">Повторить</button>
                            </div>
                        `;
                list.innerHTML = '';
            }
        }

        // ============================================================
        //  ОТРИСОВКА (ТОЛЬКО innerHTML)
        // ============================================================
        function renderAll(news) {
            const top3 = news.slice(0, 3);
            const rest = news.slice(3);

            // Плитки
            let tilesHtml = '';
            for (const item of top3) {
                const imgHtml = item.imageUrl ?
                    `<div class="tile-img-wrap"><img src="${escapeHtml(item.imageUrl)}" alt="" onerror="this.style.display='none'"></div>` :
                    '';
                tilesHtml += `
                            <div class="tile" onclick="openDetail(${item.id})">
                                ${imgHtml}
                                <div class="tile-title">${escapeHtml(item.title)}</div>
                            </div>
                        `;
            }
            document.getElementById('tilesContainer').innerHTML = tilesHtml;

            // Список
            let listHtml = '';
            for (const item of rest) {
                const imgHtml = item.imageUrl ?
                    `<div class="list-img-wrap"><img src="${escapeHtml(item.imageUrl)}" alt="" onerror="this.style.display='none'"></div>` :
                    '';
                listHtml += `
                            <div class="list-item" onclick="openDetail(${item.id})">
                                <div class="list-title">${escapeHtml(item.title)}</div>
                                ${imgHtml}
                            </div>
                        `;
            }
            document.getElementById('listContainer').innerHTML = listHtml ||
                '<div style="padding:20px;text-align:center;color:#777;">Это все новости</div>';
        }

        // ============================================================
        //  ДЕТАЛЬНЫЙ ЭКРАН
        // ============================================================
        async function openDetail(newsId) {
            const news = allNews.find(n => n.id === newsId);
            if (!news) return;

            currentNews = news;
            document.getElementById('detailTitle').textContent = news.title;
            document.getElementById('detailScreen').classList.add('active');

            const content = document.getElementById('detailContent');
            const likes = localStorage.getItem(`likes_${news.id}`) ? parseInt(localStorage.getItem(`likes_${news.id}`), 10) : 0;

            const imgHtml = news.imageUrl ?
                `<div class="detail-img-wrap"><img src="${escapeHtml(news.imageUrl)}" alt="" onerror="this.style.display='none'"></div>` :
                '';

            content.innerHTML = `
                        ${imgHtml}
                        <div class="detail-headline">${escapeHtml(news.title)}</div>
                        <div class="detail-body">${escapeHtml(news.text)}</div>

                        <div class="like-container">
                            <button class="like-btn" id="likeBtn" onclick="toggleLike()">Поставить лайк новости</button>
                            <span class="like-count" id="likeCount">${likes}</span>
                        </div>

                        <div class="comments-section">
                            <div class="comments-title">Комментарии</div>
                            <div id="commentsList">Загрузка...</div>

                            <div class="add-comment-form">
                                <div class="form-title">Хотите оставить мнение?</div>
                                <input type="text" id="commentName" placeholder="Укажите имя...">
                                <input type="text" id="commentText" placeholder="Напишите комментарий...">
                                <button class="submit-comment" onclick="submitComment()">Отправить</button>
                            </div>
                        </div>
                    `;

            loadComments(news.id);
            updateLikeButton();
        }

        // ============================================================
        //  КОММЕНТАРИИ
        // ============================================================
        async function loadComments(newsId) {
            const list = document.getElementById('commentsList');
            if (!list) return;

            try {
                const url = `${API_BASE}?action=getComments&newsId=${newsId}`;
                const response = await fetch(url);
                const data = await response.json();

                if (!data.success || !data.data || data.data.length === 0) {
                    list.innerHTML = '<div style="color:#777;padding:8px 0;">Нет комментариев</div>';
                    return;
                }

                let html = '';
                for (const c of data.data) {
                    html += `
                                <div class="comment-item">
                                    <div class="comment-author">${escapeHtml(c.name)}</div>
                                    <div class="comment-text">${escapeHtml(c.text)}</div>
                                    <div class="comment-actions">
                                        <button onclick="replyComment('${escapeHtml(c.name)}')">Ответить</button>
                                        <button onclick="likeComment()">Нравится</button>
                                    </div>
                                </div>
                            `;
                }
                list.innerHTML = html;
            } catch (error) {
                list.innerHTML = '<div style="color:#b00020;padding:8px 0;">Ошибка загрузки</div>';
            }
        }

        // ============================================================
        //  ДОБАВЛЕНИЕ КОММЕНТАРИЯ
        // ============================================================
        async function submitComment() {
            if (!currentNews) return;
            const name = document.getElementById('commentName').value.trim() || 'Аноним';
            const text = document.getElementById('commentText').value.trim();
            if (!text) {
                alert('Напишите текст комментария');
                return;
            }

            const btn = document.querySelector('.submit-comment');
            btn.disabled = true;
            btn.textContent = '...';

            try {
                const url =
                    `${API_BASE}?action=addComment&newsId=${currentNews.id}&name=${encodeURIComponent(name)}&text=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.success) {
                    document.getElementById('commentText').value = '';
                    loadComments(currentNews.id);
                } else {
                    alert('Ошибка: ' + (data.error || 'Неизвестная ошибка'));
                }
            } catch (error) {
                alert('Ошибка: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Отправить';
            }
        }

        // ============================================================
        //  ЛАЙК
        // ============================================================
        function toggleLike() {
            if (!currentNews) return;
            const key = `likes_${currentNews.id}`;
            let count = localStorage.getItem(key) ? parseInt(localStorage.getItem(key), 10) : 0;
            count += 1;
            localStorage.setItem(key, count);
            updateLikeButton();
        }

        function updateLikeButton() {
            if (!currentNews) return;
            const btn = document.getElementById('likeBtn');
            const count = document.getElementById('likeCount');
            if (!btn || !count) return;
            const val = localStorage.getItem(`likes_${currentNews.id}`) ? parseInt(localStorage.getItem(`likes_${currentNews.id}`), 10) : 0;
            count.textContent = val;
            btn.textContent = val > 0 ? 'Вы поставили лайк' : 'Поставить лайк новости';
            btn.classList.toggle('liked', val > 0);
        }

        // ============================================================
        //  УТИЛИТЫ
        // ============================================================
        function replyComment(name) {
            const input = document.getElementById('commentText');
            if (input) {
                input.value = `@${name} `;
                input.focus();
            }
        }

        function likeComment() {
            const btn = event.target;
            btn.textContent = 'Нравится';
            setTimeout(() => { btn.textContent = 'Нравится'; }, 1000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(str).replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // ============================================================
        //  ЗАКРЫТИЕ ДЕТАЛЬНОГО ЭКРАНА
        // ============================================================
        document.getElementById('backBtn').addEventListener('click', function() {
            document.getElementById('detailScreen').classList.remove('active');
        });

        // ============================================================
        //  КНОПКА ОБНОВЛЕНИЯ
        // ============================================================
        document.getElementById('refreshBtn').addEventListener('click', function() {
            loadNews();
        });

        // ============================================================
        //  ПРЕДУПРЕЖДЕНИЕ О БЕСПИЛОТНИКАХ
        // ============================================================
        (function initDroneAlert() {
            const alertEl = document.getElementById('droneAlert');
            const textEl = document.getElementById('droneText');
            if (DRONE_ALERT_ENABLED === 1) {
                alertEl.classList.add('active');
                textEl.textContent = DRONE_ALERT_TEXT;
            } else {
                alertEl.classList.remove('active');
            }
        })();

        // ============================================================
        //  ЗАПУСК
        // ============================================================
        window.onload = function() {
            loadNews();
        };
    </script>

</body>
</html>
