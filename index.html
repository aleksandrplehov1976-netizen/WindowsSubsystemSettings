<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Папки</title>
<style>
:root{--bg1:#fbfbfd;--bg2:#e8e8ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b2b30;--bg2:#111113}}
:root[data-theme="dark"]{--bg1:#2b2b30;--bg2:#111113}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg2);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg1),var(--bg2));font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif}
#sa{position:fixed;visibility:hidden;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
/* Сцена плоская: порядок папок определяет только z-index, глубину слоёв браузер не сортирует */
#stage{position:fixed;inset:0;perspective-origin:50% 38%}
.b,.c{position:absolute;left:50%;top:0;will-change:transform}
.tab,.bb,.sheet,.c{position:absolute}
.tab{left:calc(var(--u)*9);top:0;width:calc(var(--u)*362);height:calc(var(--u)*74);border-radius:calc(var(--u)*40) calc(var(--u)*37) 0 0}
.bb{left:calc(var(--u)*9);right:calc(var(--u)*9);top:calc(var(--u)*37);border-radius:0 calc(var(--u)*32) calc(var(--u)*26) calc(var(--u)*26)}
.tl{position:absolute;left:calc(var(--u)*34);top:5px;font-size:12px;font-weight:600;letter-spacing:.01em;opacity:0}
.sheet{left:calc(var(--u)*22);right:calc(var(--u)*22);top:calc(var(--u)*74);border-radius:12px 12px 14px 14px;overflow:auto;box-sizing:border-box;padding:24px 22px 40px;color:#3a3a3c;background:#fffefd;box-shadow:inset 0 10px 14px -10px rgba(0,0,0,.16);-webkit-overflow-scrolling:touch}
.sheet h2{margin:0 0 4px;font-size:32px;font-weight:600;letter-spacing:-.6px}
.sheet small{display:block;margin-bottom:16px;opacity:.5;font-size:13px}
.sheet p{margin:0 0 14px;font-size:16px;line-height:1.5}
/* Обложка: один плоский слой, шарнир по нижней кромке, изнанка скрыта */
.c{top:calc(var(--u)*60);transform-origin:50% 100%;border-radius:calc(var(--u)*32) calc(var(--u)*32) calc(var(--u)*26) calc(var(--u)*26);box-shadow:0 -3px 16px rgba(0,0,0,.13);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.label{position:absolute;left:calc(var(--u)*40);top:calc(var(--u)*30);line-height:1;font-weight:400;letter-spacing:-.02em;white-space:nowrap}
.sh{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(to bottom,rgba(0,0,0,.5),rgba(0,0,0,.05));opacity:0;pointer-events:none}
#strip{position:fixed;left:0;right:0;bottom:0;height:150px;z-index:99;display:none;touch-action:none}

/* ===== Редактор стикеров ===== */
#editor{
  position:fixed;inset:0;z-index:200;display:none;
  background:rgba(0,0,0,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  pointer-events:none;
}
#editor.on{display:block}
#editor .topbar{
  position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;gap:12px;
  color:#fff;font-size:15px;font-weight:600;
  background:linear-gradient(to bottom,rgba(0,0,0,.35),rgba(0,0,0,0));
  pointer-events:auto;
}
#editor .topbar button{
  border:0;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;
  background:rgba(255,255,255,.92);color:#111;
}
#editor .topbar button.ghost{background:rgba(255,255,255,.18);color:#fff}
#canvas{
  position:absolute;inset:0;pointer-events:none;
}
#canvas.on{pointer-events:auto}
.st{
  position:absolute;left:0;top:0;transform-origin:50% 50%;
  pointer-events:auto;touch-action:none;will-change:transform;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.22));
}
.st img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
.st .grip{
  position:absolute;width:22px;height:22px;border-radius:50%;
  background:#fff;border:2px solid #111;box-shadow:0 2px 6px rgba(0,0,0,.25);
  opacity:0;transition:opacity .15s;
}
.st.sel .grip{opacity:1}
.st .grip.rot{left:50%;top:-30px;transform:translateX(-50%);cursor:grab}
.st .grip.sz{right:-12px;bottom:-12px;cursor:nwse-resize}
.st .del{
  position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);
  background:#ff3b30;color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;
  opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap;
}
.st.sel .del{opacity:1;pointer-events:auto}

#shelf{
  position:absolute;left:0;right:0;bottom:0;
  height:220px;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 14px);
  background:rgba(20,20,22,.82);color:#fff;
  display:flex;flex-direction:column;gap:10px;
  pointer-events:auto;
  border-top-left-radius:22px;border-top-right-radius:22px;
  box-shadow:0 -10px 30px rgba(0,0,0,.35);
}
#shelf .row{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:4px 2px;scrollbar-width:none}
#shelf .row::-webkit-scrollbar{display:none}
#shelf .pick{
  flex:0 0 auto;width:96px;height:96px;border-radius:14px;background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .12s, background .12s;
}
#shelf .pick:active{transform:scale(.94);background:rgba(255,255,255,.16)}
#shelf .pick img{max-width:78px;max-height:78px;object-fit:contain;pointer-events:none}
#shelf .hint{font-size:12px;opacity:.7;padding:0 4px}
</style>
</head>
<body>
<div id="sa"></div><div id="stage"></div><div id="strip"></div>

<div id="editor">
  <div class="topbar">
    <button class="ghost" id="btn-cancel">Отмена</button>
    <span id="editor-title">Стикеры</span>
    <button id="btn-save">Готово</button>
  </div>
  <div id="canvas"></div>
  <div id="shelf">
    <div class="hint">Тапни стикер — он появится на папке. Тащи, крути, меняй размер.</div>
    <div class="row" id="shelf-row"></div>
  </div>
</div>

<script>
/* ===== Стикеры. Поменяй пути, если папка называется иначе ===== */
const STICKERS = [
  "./src/sticker1.png", "./src/sticker2.png", "./src/sticker3.png",
  "./src/sticker4.png", "./src/sticker5.png", "./src/sticker6.png",
  "./src/sticker7.png", "./src/sticker8.png", "./src/sticker9.png",
  "./src/sticker10.png", "./src/sticker11.png"
];

const DATA=[
 {t:"A1",b:"#7FB5B5",f:"#8CC2C2",c:"#fff"},
 {t:"A2",b:"#A18594",f:"#AD94A1",c:"#fff"},
 {t:"B1",b:"#FF9BAA",f:"#FFA9B6",c:"#fff"},
 {t:"B2",b:"#EAE0C8",f:"#F0E8D4",c:"#555"},
 {t:"Носитель (C)",b:"#FFF0F5",f:"#FFF5F8",c:"#555"}
];
const LOREM="Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.";
const stage=document.getElementById("stage"),strip=document.getElementById("strip"),sa=document.getElementById("sa");
const clamp=(v,a,b)=>v<a?a:v>b?b:v, n=DATA.length;
let H,W,u,ys=[],top0,sab,base,Hb,step,o=-1;
const s={p:0,v:0,t:0};

/* ===== Хранилище стикеров: { folderIndex: [ {id,src,x,y,rot,scale}, ... ] } ===== */
const STORE_KEY = "stickers_v1";
let stickerStore = loadStore();
function loadStore(){ try{return JSON.parse(localStorage.getItem(STORE_KEY))||{}}catch(e){return{}} }
function saveStore(){ try{localStorage.setItem(STORE_KEY, JSON.stringify(stickerStore))}catch(e){} }

/* ===== Папки (без изменений в логике) ===== */
const els=DATA.map((d,i)=>{
  const b=document.createElement("div");b.className="b";b.style.zIndex=2*i;
  b.innerHTML=`<div class="bb" style="background:${d.b}"></div><div class="tab" style="background:${d.b}"><span class="tl" style="color:${d.c}">${d.t}</span></div>`+
    `<div class="sheet"><h2>${d.t}</h2><small>Заметки · обновлено сегодня</small><p>${LOREM}</p><p>${LOREM}</p><p>${LOREM}</p></div>`;
  const c=document.createElement("div");c.className="c";c.style.zIndex=2*i+1;c.style.background=d.f;
  c.innerHTML=`<span class="label" style="color:${d.c}">${d.t}</span><i class="sh"></i>`;
  stage.append(b,c);
  const e={b,c,bb:b.querySelector(".bb"),tab:b.querySelector(".tab"),tl:b.querySelector(".tl"),sheet:b.querySelector(".sheet"),label:c.querySelector(".label"),sh:c.querySelector(".sh")};
  const tap=()=>{if(o<0)open(i)};
  c.addEventListener("click",tap);e.tab.addEventListener("click",()=>{o<0?open(i):(o===i&&s.p>.9&&close())});
  /* Long-press на обложке — редактор стикеров */
  attachLongPress(c, ()=>openStickerEditor(i));
  attachLongPress(e.tab, ()=>openStickerEditor(i));
  return e;
});

function attachLongPress(el, fn){
  let t=null, sx=0, sy=0, fired=false;
  const start=(x,y)=>{fired=false;sx=x;sy=y;clearTimeout(t);t=setTimeout(()=>{fired=true;fn()},450)};
  const move=(x,y)=>{if(!t)return;if(Math.hypot(x-sx,y-sy)>10){clearTimeout(t);t=null}};
  const end=()=>{clearTimeout(t);t=null};
  el.addEventListener("pointerdown",e=>{if(e.button&&e.button!==0)return;start(e.clientX,e.clientY)});
  el.addEventListener("pointermove",e=>move(e.clientX,e.clientY));
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
  el.addEventListener("pointerleave",end);
  el.addEventListener("contextmenu",e=>{if(fired){e.preventDefault();fired=false}});
}

function layout(){
  H=innerHeight;const cs=getComputedStyle(sa);
  top0=(parseFloat(cs.paddingTop)||0)+20;sab=parseFloat(cs.paddingBottom)||0;
  W=Math.min(innerWidth-32,460);u=W/725;
  stage.style.setProperty("--u",u+"px");stage.style.perspective="2400px";
  base=H-sab-132;
  Hb=base-top0;
  step=Math.min(204*u,(H-sab-top0-60*u-200)/4);
  ys=DATA.map((_,i)=>top0+i*step);
  els.forEach(e=>{
    for(const el of [e.b,e.c]){el.style.width=W+"px";el.style.marginLeft=(-W/2)+"px"}
    e.b.style.height=Hb+"px";
    e.bb.style.height=(Hb-37*u)+"px";
    e.c.style.height=(Hb-60*u)+"px";
    e.sheet.style.height=(Hb-74*u-18)+"px";
    e.label.style.fontSize=Math.min(96*u,step*.48)+"px";
  });
  render();
  if(editorFolder>=0) layoutCanvas();
}

function render(){
  const p=s.p;
  els.forEach((e,i)=>{
    let ty=0,z=0,rx=0,q=0,shade=0;
    if(o>=0){
      if(i===o){
        ty=(top0-ys[i])*p;
        z=56*clamp(p,0,1);
        const t=clamp((p-.1)/.62,0,1);
        const ant=3.5*Math.sin(Math.PI*clamp(p/.12,0,1));
        const th=84*t*t;
        rx=ant-th;shade=.38*Math.sin(th*Math.PI/180);
      }else{
        const r=i<o?i:i-1,d=.045*(n-1-i);
        q=clamp((p-d)/(.8-d),0,1.02);
        ty=(base+10+r*22-ys[i])*q;
      }
    }
    const T=`translate3d(0,${(ys[i]+ty).toFixed(2)}px,${z.toFixed(2)}px)`;
    e.b.style.transform=T;
    e.c.style.transform=T+(rx?` rotateX(${rx.toFixed(2)}deg)`:"");
    e.sh.style.opacity=shade.toFixed(3);
    const qc=clamp(q,0,1);
    e.tl.style.opacity=qc;
    e.label.style.opacity=1-clamp(qc*3,0,1);
  });
  strip.style.display=(o>=0&&p>.6)?"block":"none";
}

let last=0,raf=0;
function loop(t){
  let dt=Math.min(.033,((t-last)/1000)||.016);last=t;
  const k=105,c=18.5;
  s.v+=(k*(s.t-s.p)-c*s.v)*dt;s.p+=s.v*dt;
  if(Math.abs(s.v)<.002&&Math.abs(s.t-s.p)<.0008){s.p=s.t;s.v=0;if(s.t===0)o=-1;render();raf=0;return}
  render();raf=requestAnimationFrame(loop);
}
function go(){if(!raf){last=performance.now();raf=requestAnimationFrame(loop)}}
function open(i){if(o>=0)return;o=i;s.t=1;go()}
function close(){if(o<0)return;s.t=0;go()}

let sy=0,done=false;
strip.addEventListener("pointerdown",e=>{strip.setPointerCapture(e.pointerId);sy=e.clientY;done=false});
strip.addEventListener("pointermove",e=>{if(!done&&sy-e.clientY>14){done=true;close()}});
strip.addEventListener("pointerup",()=>{if(!done){done=true;close()}});

addEventListener("resize",layout);

/* ============================================================
   ==================  РЕДАКТОР СТИКЕРОВ  =====================
   ============================================================ */

const editor = document.getElementById("editor");
const canvas = document.getElementById("canvas");
const shelfRow = document.getElementById("shelf-row");
const editorTitle = document.getElementById("editor-title");
let editorFolder = -1;            // индекс папки, которую редактируем
let editing = [];                 // рабочие копии стикеров текущей папки
let selectedId = null;
let idSeq = 1;
const uid = () => "s" + (Date.now().toString(36)) + (idSeq++);

/* Наполняем полку стикеров */
STICKERS.forEach(src=>{
  const d = document.createElement("div");
  d.className = "pick";
  const img = document.createElement("img");
  img.src = src; img.alt = "";
  img.onerror = ()=>{ d.style.opacity=.25; d.title="Файл не найден: "+src; };
  d.appendChild(img);
  d.addEventListener("click", ()=> addSticker(src));
  shelfRow.appendChild(d);
});

function openStickerEditor(idx){
  /* Если папка ещё не открыта анимацией — открываем её, но редактор поверх */
  if(o<0) open(idx);
  editorFolder = idx;
  editing = JSON.parse(JSON.stringify(stickerStore[idx] || []));
  selectedId = null;
  editorTitle.textContent = "Стикеры · " + DATA[idx].t;
  editor.classList.add("on");
  canvas.classList.add("on");
  document.getElementById("strip").style.display = "none"; // не мешает
  layoutCanvas();
  renderStickers();
}

function closeStickerEditor(save){
  if(editorFolder<0) return;
  if(save){
    stickerStore[editorFolder] = editing;
    saveStore();
  }
  editor.classList.remove("on");
  canvas.classList.remove("on");
  canvas.innerHTML = "";
  editorFolder = -1;
  editing = []; selectedId = null;
}

document.getElementById("btn-cancel").addEventListener("click", ()=>closeStickerEditor(false));
document.getElementById("btn-save").addEventListener("click", ()=>closeStickerEditor(true));

/* Холст = прямоугольник открытой папки (обложки) с учётом открытого состояния.
   Считаем в координатах окна, чтобы стикеры совпадали с папкой. */
function layoutCanvas(){
  /* Папка открыта (o=editorFolder, s.p ~ 1). Её итоговая позиция:
     top = ys[idx] + (top0 - ys[idx])*1 = top0
     height = Hb - 60u  (это .c) */
  const idx = editorFolder;
  if(idx<0) return;
  const cH = Hb - 60*u;
  canvas.style.left = ((innerWidth - W)/2) + "px";
  canvas.style.top = top0 + "px";
  canvas.style.width = W + "px";
  canvas.style.height = cH + "px";
}

/* --- Рендер рабочих стикеров --- */
function renderStickers(){
  canvas.innerHTML = "";
  editing.forEach(st=>{
    const el = document.createElement("div");
    el.className = "st" + (st.id===selectedId ? " sel" : "");
    el.dataset.id = st.id;
    el.style.width = "90px";
    el.style.height = "90px";
    el.style.transform = `translate(${st.x}px, ${st.y}px) rotate(${st.rot}deg) scale(${st.scale})`;
    el.innerHTML = `
      <img src="${st.src}" alt="">
      <div class="grip rot" data-grip="rot"></div>
      <div class="grip sz" data-grip="sz"></div>
      <div class="del">Удалить</div>`;
    canvas.appendChild(el);
    attachStickerHandlers(el, st);
  });
}

function addSticker(src){
  /* Ставим по центру папки со случайным небольшим поворотом */
  const cx = parseFloat(canvas.style.width)/2 - 45;
  const cy = parseFloat(canvas.style.height)/2 - 45;
  const st = {
    id: uid(),
    src,
    x: cx + (Math.random()*40-20),
    y: cy + (Math.random()*40-20),
    rot: Math.random()*20-10,
    scale: 1
  };
  editing.push(st);
  selectedId = st.id;
  renderStickers();
  /* Автосохранение каждый раз при изменении — надёжнее */
  stickerStore[editorFolder] = editing; saveStore();
}

/* --- Жесты на стикере --- */
function attachStickerHandlers(el, st){
  let mode = null;        // "move" | "rot" | "sz"
  let start = null;
  const rectOfCanvas = ()=>canvas.getBoundingClientRect();

  el.addEventListener("pointerdown", e=>{
    if(e.target.classList.contains("del")){
      e.stopPropagation();
      editing = editing.filter(x=>x.id!==st.id);
      stickerStore[editorFolder] = editing; saveStore();
      renderStickers();
      return;
    }
    selectedId = st.id;
    renderStickers();  // перерисовать выделение (просто и надёжно)
    /* Найти заново наш el после перерисовки */
    const fresh = canvas.querySelector(`.st[data-id="${st.id}"]`);
    if(!fresh) return;
    const grip = e.target.closest(".grip");
    mode = grip ? grip.dataset.grip : "move";
    start = {
      x: e.clientX, y: e.clientY,
      stx: st.x, sty: st.y, srot: st.rot, sscale: st.scale
    };
    fresh.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  el.addEventListener("pointermove", e=>{
    if(!mode) return;
    const cr = rectOfCanvas();
    const dx = e.clientX - start.x;
    const dy = e.clientY - start.y;
    if(mode==="move"){
      st.x = start.stx + dx;
      st.y = start.sty + dy;
    } else if(mode==="rot"){
      const box = el.getBoundingClientRect();
      const cx = cr.left + (st.x + 45);   // центр стикера (90/2=45) в координатах страницы
      const cy = cr.top  + (st.y + 45);
      const ang = Math.atan2(e.clientY - cy, e.clientX - cx) * 180/Math.PI + 90;
      st.rot = ang;
    } else if(mode==="sz"){
      const d = (dx - dy) / 2;
      st.scale = clamp(start.sscale + d/70, 0.3, 4);
    }
    const fresh = canvas.querySelector(`.st[data-id="${st.id}"]`);
    if(fresh) fresh.style.transform = `translate(${st.x}px, ${st.y}px) rotate(${st.rot}deg) scale(${st.scale})`;
  });

  const finish = ()=>{
    if(!mode) return;
    mode = null;
    stickerStore[editorFolder] = editing; saveStore();
  };
  el.addEventListener("pointerup", finish);
  el.addEventListener("pointercancel", finish);
  el.addEventListener("pointerleave", finish);
  el.addEventListener("dblclick", e=>{
    e.stopPropagation();
    editing = editing.filter(x=>x.id!==st.id);
    stickerStore[editorFolder] = editing; saveStore();
    renderStickers();
  });
}

/* Тап по пустому месту холста — снять выделение */
canvas.addEventListener("pointerdown", e=>{
  if(e.target===canvas){ selectedId=null; renderStickers(); }
});

/* ===== Инициализация ===== */
layout();

/* На случай, если пользователь открыл редактор и повернул экран */
window.addEventListener("resize", ()=>{ if(editorFolder>=0) layoutCanvas(); });
</script>
</body>
</html>
