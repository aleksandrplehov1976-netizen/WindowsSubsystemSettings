<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Черный экран · финальные значения</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #000;
      overflow: hidden;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      cursor: pointer;
    }

    .controls {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(15, 15, 15, 0.95);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px 24px;
      align-items: center;
      justify-content: center;
      z-index: 100;
      border-bottom: 1px solid #222;
      cursor: default;
      font-size: 13px;
      color: #eee;
    }

    .control-item {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .control-item label {
      color: #aaa;
      font-size: 12px;
      min-width: 180px;
    }

    .control-item input[type="range"] {
      width: 140px;
      cursor: pointer;
      accent-color: #fff;
    }

    .control-item .value {
      color: #fff;
      font-variant-numeric: tabular-nums;
      min-width: 42px;
      text-align: right;
      font-size: 12px;
    }

    .controls button {
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid #444;
      background: #1a1a1a;
      color: #fff;
      font-family: inherit;
      transition: background 0.15s;
    }

    .controls button:hover {
      background: #2a2a2a;
    }

    .bottom-area {
      position: absolute;
      left: 50%;
      bottom: 35px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .side-btn {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      pointer-events: auto;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      outline: none;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      visibility: hidden;
      align-self: center;
      transition: transform 0s;
    }

    .side-btn.active {
      visibility: visible;
    }

    .side-btn img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .side-btn svg {
      position: relative;
      width: 22px;
      height: 77px;
      display: block;
      pointer-events: none;
      z-index: 2;
      fill: #ffffff;
    }

    .video-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      flex-shrink: 0;
      align-self: center;
      width: 113px;
      height: 113px;
      transform: translateY(7px);
    }

    .video-stage video {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: block;
      object-fit: contain;
      background: transparent;
      pointer-events: none;
      border: none;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      box-shadow: none;
      opacity: 0;
      visibility: hidden;
      width: 100%;
      height: 100%;
    }

    .video-stage video.visible {
      visibility: visible;
      opacity: 1;
    }

    .video-stage video.fade-in {
      visibility: visible;
      opacity: 0;
      transition: opacity 1.7s ease;
    }

    .video-stage video.fade-in-active {
      visibility: visible;
      opacity: 1;
    }

    .video-stage video.fade-out {
      visibility: visible;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    button {
      background: transparent;
      border: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible {
      outline: none;
    }
  </style>
</head>
<body>
  <div class="controls" id="controls">
    <div class="control-item">
      <label>Положение иконок ↑↓</label>
      <input type="range" id="iconOffsetY" min="-300" max="300" value="0" step="1">
      <span class="value" id="iconOffsetYVal">0</span>
    </div>
    <button id="reportBtn" type="button">Выдать значение</button>
  </div>

  <div class="bottom-area" id="bottomArea">
    <button class="side-btn" id="leftBtn" aria-label="toggle-icon">
      <img src="buttons.png" alt="">
      <svg id="leftIcon" xmlns="http://www.w3.org/2000/svg" viewBox="305 -1603 2232 1764" width="22" height="77" fill="#ffffff">
        <path d="M1383 161C1449 161 1496 114 1496 49V-1485C1496 -1550 1449 -1603 1381 -1603C1334 -1603 1303 -1582 1252 -1534L825 -1134C819 -1128 810 -1125 800 -1125H514C378 -1125 305 -1050 305 -906V-534C305 -389 378 -315 514 -315H800C810 -315 819 -312 825 -306L1252 98C1297 142 1336 161 1383 161ZM2224 -35C2261 -10 2307 -19 2334 -57C2462 -233 2537 -475 2537 -722C2537 -969 2463 -1213 2334 -1387C2307 -1425 2261 -1434 2224 -1409C2187 -1384 2181 -1337 2210 -1296C2319 -1142 2382 -935 2382 -722C2382 -509 2317 -304 2210 -148C2182 -107 2187 -60 2224 -35ZM1854 -296C1887 -273 1934 -280 1961 -319C2038 -420 2084 -569 2084 -722C2084 -875 2038 -1023 1961 -1125C1934 -1164 1887 -1172 1854 -1148C1813 -1120 1807 -1070 1838 -1029C1896 -949 1929 -838 1929 -722C1929 -606 1895 -496 1838 -415C1808 -373 1813 -325 1854 -296Z"/>
      </svg>
    </button>

    <div class="video-stage" id="videoStage"></div>

    <button class="side-btn" id="rightBtn" aria-label="close">
      <img src="buttons.png" alt="">
      <svg id="rightIcon" xmlns="http://www.w3.org/2000/svg" viewBox="255 -1512 2517 1580" width="22" height="77" fill="#ffffff">
        <path d="M569 68H2458C2666 68 2772 -36 2772 -242V-1203C2772 -1408 2666 -1512 2458 -1512H569C359 -1512 255 -1409 255 -1203V-242C255 -36 359 68 569 68ZM571 -93C471 -93 416 -147 416 -251V-1194C416 -1298 471 -1351 571 -1351H2455C2554 -1351 2611 -1298 2611 -1194V-251C2611 -147 2554 -93 2455 -93ZM661 -955H753C781 -955 798 -972 798 -999V-1091C798 -1119 781 -1136 753 -1136H661C634 -1136 617 -1119 617 -1091V-999C617 -972 634 -955 661 -955ZM983 -955H1075C1102 -955 1119 -972 1119 -999V-1091C1119 -1119 1102 -1136 1075 -1136H983C955 -1136 938 -1119 938 -1091V-999C938 -972 955 -955 983 -955ZM1305 -955H1396C1424 -955 1441 -972 1441 -999V-1091C1441 -1119 1424 -1136 1396 -1136H1305C1277 -1136 1260 -1119 1260 -1091V-999C1260 -972 1277 -955 1305 -955ZM1626 -955H1718C1746 -955 1763 -972 1763 -999V-1091C1763 -1119 1746 -1136 1718 -1136H1626C1599 -1136 1582 -1119 1582 -1091V-999C1582 -972 1599 -955 1626 -955ZM1948 -955H2040C2067 -955 2084 -972 2084 -999V-1091C2084 -1119 2067 -1136 2040 -1136H1948C1920 -1136 1903 -1119 1903 -1091V-999C1903 -972 1920 -955 1948 -955ZM2270 -955H2361C2389 -955 2406 -972 2406 -999V-1091C2406 -1119 2389 -1136 2361 -1136H2270C2242 -1136 2225 -1119 2225 -1091V-999C2225 -972 2242 -955 2270 -955ZM661 -633H753C781 -633 798 -650 798 -678V-769C798 -797 781 -814 753 -814H661C634 -814 617 -797 617 -769V-678C617 -650 634 -633 661 -633ZM983 -633H1075C1102 -633 1119 -650 1119 -678V-769C1119 -797 1102 -814 1075 -814H983C955 -814 938 -797 938 -769V-678C938 -650 955 -633 983 -633ZM1305 -633H1396C1424 -633 1441 -650 1441 -678V-769C1441 -797 1424 -814 1396 -814H1305C1277 -814 1260 -797 1260 -769V-678C1260 -650 1277 -633 1305 -633ZM1626 -633H1718C1746 -633 1763 -650 1763 -678V-769C1763 -797 1746 -814 1718 -814H1626C1599 -814 1582 -797 1582 -769V-678C1582 -650 1599 -633 1626 -633ZM1948 -633H2040C2067 -633 2084 -650 2084 -678V-769C2084 -797 2067 -814 2040 -814H1948C1920 -814 1903 -797 1903 -769V-678C1903 -650 1920 -633 1948 -633ZM2270 -633H2361C2389 -633 2406 -650 2406 -678V-769C2406 -797 2389 -814 2361 -814H2270C2242 -814 2225 -797 2225 -769V-678C2225 -650 2242 -633 2270 -633ZM661 -311H753C781 -311 798 -328 798 -356V-448C798 -475 781 -492 753 -492H661C634 -492 617 -475 617 -448V-356C617 -328 634 -311 661 -311ZM993 -311H2030C2064 -311 2084 -331 2084 -366V-438C2084 -472 2064 -492 2030 -492H993C958 -492 938 -472 938 -438V-366C938 -331 958 -311 993 -311ZM2270 -311H2361C2389 -311 2406 -328 2406 -356V-448C2406 -475 2389 -492 2361 -492H2270C2242 -492 2225 -475 2225 -448V-356C2225 -328 2242 -311 2270 -311Z"/>
      </svg>
    </button>
  </div>

  <script>
    (function() {
      const videoStage = document.getElementById('videoStage');
      const bottomArea = document.getElementById('bottomArea');
      const leftBtn = document.getElementById('leftBtn');
      const rightBtn = document.getElementById('rightBtn');
      const leftIcon = document.getElementById('leftIcon');
      const rightIcon = document.getElementById('rightIcon');

      const iconOffsetYInput = document.getElementById('iconOffsetY');
      const iconOffsetYVal = document.getElementById('iconOffsetYVal');
      const reportBtn = document.getElementById('reportBtn');

      const FIRST_VIDEO = '1790618271.MP4';
      const SECOND_VIDEO = '1790618830.MP4';

      const ICON_PLAY = 'M1383 161C1449 161 1496 114 1496 49V-1485C1496 -1550 1449 -1603 1381 -1603C1334 -1603 1303 -1582 1252 -1534L825 -1134C819 -1128 810 -1125 800 -1125H514C378 -1125 305 -1050 305 -906V-534C305 -389 378 -315 514 -315H800C810 -315 819 -312 825 -306L1252 98C1297 142 1336 161 1383 161ZM2224 -35C2261 -10 2307 -19 2334 -57C2462 -233 2537 -475 2537 -722C2537 -969 2463 -1213 2334 -1387C2307 -1425 2261 -1434 2224 -1409C2187 -1384 2181 -1337 2210 -1296C2319 -1142 2382 -935 2382 -722C2382 -509 2317 -304 2210 -148C2182 -107 2187 -60 2224 -35ZM1854 -296C1887 -273 1934 -280 1961 -319C2038 -420 2084 -569 2084 -722C2084 -875 2038 -1023 1961 -1125C1934 -1164 1887 -1172 1854 -1148C1813 -1120 1807 -1070 1838 -1029C1896 -949 1929 -838 1929 -722C1929 -606 1895 -496 1838 -415C1808 -373 1813 -325 1854 -296Z';
      const ICON_PLAY_VIEWBOX = '305 -1603 2232 1764';

      const ICON_STOP = 'M1496 -461V-1485C1496 -1550 1449 -1603 1381 -1603C1334 -1603 1303 -1582 1251 -1534L849 -1161C844 -1157 838 -1153 832 -1153H802ZM1841 266C1871 296 1921 296 1950 266C1980 235 1980 187 1950 157L238 -1555C208 -1585 158 -1585 128 -1555C98 -1526 98 -1475 128 -1446ZM509 -315H794C804 -315 812 -312 819 -306L1251 98C1298 142 1336 161 1382 161C1434 161 1473 135 1489 78L349 -1061C320 -1028 305 -978 305 -911V-528C305 -383 373 -315 509 -315Z';
      const ICON_STOP_VIEWBOX = '106 -1603 1866 1891';

      let videoA = null;
      let videoB = null;
      let activeVideo = null;
      let isActive = false;

      function applySizes() {
        const offsetY = parseInt(iconOffsetYInput.value, 10);
        iconOffsetYVal.textContent = offsetY;

        /* Смещаем обе иконки по вертикали относительно их центральной линии */
        leftBtn.style.transform = 'translateY(' + (-offsetY) + 'px)';
        rightBtn.style.transform = 'translateY(' + (-offsetY) + 'px)';
      }

      iconOffsetYInput.addEventListener('input', applySizes);
      applySizes();

      reportBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        alert('Положение иконок по вертикали: ' + iconOffsetYInput.value + 'px');
      });

      function setIcon(svgEl, path, viewBox) {
        svgEl.setAttribute('viewBox', viewBox);
        svgEl.innerHTML = '<path d="' + path + '"/>';
      }

      function createVideo(src, loop) {
        const v = document.createElement('video');
        v.src = src;
        v.controls = false;
        v.autoplay = false;
        v.playsInline = true;
        v.preload = 'auto';
        v.loop = loop;
        v.muted = false;
        v.disablePictureInPicture = true;
        v.setAttribute('disablePictureInPicture', '');
        v.setAttribute('controlsList', 'nodownload nofullscreen noremoteplayback');
        return v;
      }

      function init() {
        if (videoA) return;

        videoA = createVideo(FIRST_VIDEO, false);
        videoB = createVideo(SECOND_VIDEO, true);

        videoStage.appendChild(videoA);
        videoStage.appendChild(videoB);

        videoA.addEventListener('ended', onFirstEnded);
      }

      function safePlay(v) {
        const p = v.play();
        if (p !== undefined) {
          p.catch(() => {
            v.muted = true;
            v.play().catch(() => {});
          });
        }
      }

      function updateButtons() {
        if (isActive) {
          leftBtn.classList.add('active');
          rightBtn.classList.add('active');
        } else {
          leftBtn.classList.remove('active');
          rightBtn.classList.remove('active');
        }
      }

      function startPlayback() {
        init();

        isActive = true;

        videoA.pause();
        videoB.pause();

        videoA.currentTime = 0;
        videoB.currentTime = 0;

        videoA.className = '';
        videoB.className = '';

        videoA.classList.add('fade-in');
        videoB.classList.remove('fade-in', 'fade-in-active', 'visible', 'fade-out');

        activeVideo = videoA;

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            videoA.classList.add('fade-in-active');
          });
        });

        safePlay(videoA);

        videoB.preload = 'auto';
        if (videoB.readyState < 3) {
          videoB.load();
        }

        setIcon(leftIcon, ICON_PLAY, ICON_PLAY_VIEWBOX);

        updateButtons();
      }

      function onFirstEnded() {
        if (!isActive) return;

        videoB.currentTime = 0;
        safePlay(videoB);

        videoA.className = '';
        videoA.style.visibility = 'hidden';
        videoA.style.opacity = '0';

        videoB.className = '';
        videoB.classList.add('visible');

        activeVideo = videoB;
      }

      function stopAll() {
        if (!isActive && !activeVideo) return;

        isActive = false;

        const target = activeVideo;

        videoA.pause();
        videoB.pause();

        if (target) {
          target.className = '';
          target.classList.add('fade-out');
        }

        setTimeout(() => {
          videoA.className = '';
          videoB.className = '';
          videoA.style.visibility = 'hidden';
          videoA.style.opacity = '0';
          videoB.style.visibility = 'hidden';
          videoB.style.opacity = '0';
          activeVideo = null;
        }, 500);

        updateButtons();
      }

      function toggleIcon() {
        if (!isActive) return;

        const currentPath = leftIcon.querySelector('path').getAttribute('d');
        if (currentPath === ICON_PLAY) {
          setIcon(leftIcon, ICON_STOP, ICON_STOP_VIEWBOX);
        } else {
          setIcon(leftIcon, ICON_PLAY, ICON_PLAY_VIEWBOX);
        }
      }

      document.body.addEventListener('click', function(e) {
        if (controls.contains(e.target)) return;
        if (leftBtn.contains(e.target) || rightBtn.contains(e.target)) return;
        if (!isActive) {
          startPlayback();
        }
      });

      leftBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleIcon();
      });

      rightBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        stopAll();
      });
    })();
  </script>
</body>
</html>
