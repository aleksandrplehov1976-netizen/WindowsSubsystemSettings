<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>ЭЖ · Лицей №28</title>
<style>
:root{--bg:#f2f2f7;--text:#000;--muted:#8a8a8e;--accent:#007aff;--ok:#34c759;--warn:#ff9500;--bad:#ff3b30;--card:#fff;
 --g-blur:.6px;--g-edge-blur:2px;--g-edge-w:16px;--g-sat:1.8;--tb-height:64px;--tb-pad:4px;
 font-family:-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);overscroll-behavior:none}
body{line-height:1.35;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
button,input{font:inherit;outline:0}
button{border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.i{display:block;width:1em;height:1em}
.i svg{display:block;width:100%;height:100%}
.ph{display:block;width:100%;height:100%;border:1.5px dashed currentColor;border-radius:30%;opacity:.5}

/* ===== материал: glass + jelly ===== */
.glass{position:relative;background:var(--gfill,rgba(255,255,255,.62));box-shadow:0 12px 32px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.04)}
.gb,.gf{position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.gb1{-webkit-backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat));backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat))}
.gb2{--gm:var(--g-edge-w);-webkit-backdrop-filter:blur(var(--g-edge-blur)) saturate(1.5);backdrop-filter:blur(var(--g-edge-blur)) saturate(1.5);
 -webkit-mask-image:linear-gradient(to right,#000,transparent var(--gm),transparent calc(100% - var(--gm)),#000),linear-gradient(to bottom,#000,transparent var(--gm),transparent calc(100% - var(--gm)),#000);
 mask-image:linear-gradient(to right,#000,transparent var(--gm),transparent calc(100% - var(--gm)),#000),linear-gradient(to bottom,#000,transparent var(--gm),transparent calc(100% - var(--gm)),#000)}
.gf{z-index:0;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.5),inset 1px 1px 1px -.5px rgba(255,255,255,.95),inset -1px -1px 1px -.5px rgba(255,255,255,.7),inset 0 0 12px rgba(255,255,255,.18)}
.gf::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1.5px;
 background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,0) 28%,rgba(255,255,255,0) 72%,rgba(255,255,255,.85));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass.flat .gf::before,.nog>.gf::before{display:none}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
 background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(60,60,67,.14) 30%,rgba(60,60,67,.14) 70%,rgba(255,255,255,.7));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.card.glass,.lesson-item.glass,.profile-card.glass,.settings-list.glass,.date-row.glass{background:var(--card);box-shadow:none}
.card.glass::after,.lesson-item.glass::after,.profile-card.glass::after,.settings-list.glass::after,.date-row.glass::after{display:none}
.jl{position:relative;--lit:0;touch-action:manipulation}
.jl>*:not(.gb):not(.gf){position:relative;z-index:1}
.gt{position:relative;z-index:1}
.glass>*:not(.gb):not(.gf):not(.tb-lens):not(.tb-ring):not(.tb-active-layer):not(.sg-act):not(.sg-bub){position:relative;z-index:1}
.jl::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.9),rgba(255,255,255,0) 70%);opacity:calc(var(--lit,0)*.3)}

/* ===== вход ===== */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:360px;border-radius:44px;padding:32px 20px 22px;--gfill:rgba(255,255,255,.6);animation:pin .6s cubic-bezier(.2,.9,.25,1) both}
@keyframes pin{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:none}}
.logo{width:68px;height:68px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--accent);--gfill:rgba(255,255,255,.8)}
.login-card h1{margin:0 0 6px;font:700 26px/1.15 -apple-system,"SF Pro Display",sans-serif;text-align:center;letter-spacing:-.4px}
.login-card p{margin:0 0 22px;color:var(--muted);font-size:15px;text-align:center}
.grp{background:#fff;border-radius:28px;overflow:hidden}
.grp input{display:block;width:100%;border:0;background:none;padding:15px 18px;font-size:17px;color:#111}
.grp input+input{border-top:1px solid rgba(60,60,67,.12)}
.btn{display:block;width:100%;height:54px;margin-top:16px;border-radius:999px;background:var(--accent);color:#fff;font-size:17px;font-weight:600;box-shadow:0 10px 24px rgba(10,132,255,.35)}
.btn:disabled{opacity:.5}
.err{color:var(--bad);font-size:14px;margin-top:12px;text-align:center;min-height:18px}

/* ===== каркас ===== */
#app{max-width:800px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--tb-height) + 48px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 10px}
header.top::before{content:"";position:absolute;inset:0 0 -14px 0;z-index:-1;pointer-events:none;background:linear-gradient(var(--bg) 40%,rgba(242,242,247,0))}
.greeting{font:700 32px/1.1 -apple-system,"SF Pro Display",sans-serif;letter-spacing:-.6px}
.cache-note{font-size:13px;color:var(--muted);margin-top:3px}
.round{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:22px;--gfill:rgba(255,255,255,.7)}
main{padding:0 16px}
.section-title{font:700 22px/1.15 -apple-system,"SF Pro Display",sans-serif;letter-spacing:-.4px;margin:14px 4px 12px}
.empty{text-align:center;padding:48px 24px;color:var(--muted);font-size:17px}
.spinner{display:flex;justify-content:center;padding:48px}
.spinner::after{content:"";width:28px;height:28px;border:3px solid rgba(60,60,67,.15);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#content>*{animation:paneIn .35s cubic-bezier(.2,.9,.3,1) both}
@keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== карточки ===== */
.card{border-radius:30px;padding:16px 18px;margin-bottom:12px;cursor:pointer;--gfill:rgba(255,255,255,.66)}
.subject-header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.subject-name{font:600 18px/1.2 -apple-system,"SF Pro Text",sans-serif;letter-spacing:-.2px}
.subject-avg{font-size:16px;font-weight:700;padding:4px 12px;border-radius:999px;background:rgba(120,120,128,.14)}
.subject-marks{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.mark-wrapper{position:relative;display:inline-flex}
.mark{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 8px;border-radius:17px;font-weight:700;font-size:16px}
.m5{background:rgba(48,179,80,.16);color:var(--ok)}.m4{background:rgba(10,132,255,.14);color:var(--accent)}
.m3{background:rgba(255,149,0,.17);color:var(--warn)}.m2{background:rgba(255,59,48,.14);color:var(--bad)}
.mn{background:rgba(120,120,128,.14);color:var(--muted);font-size:14px}
.mark-weight{position:absolute;top:-6px;right:-6px;background:#111;color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;padding:0 4px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:2px solid var(--card);z-index:2;pointer-events:none}
.lesson-item{display:flex;gap:14px;align-items:center;border-radius:30px;padding:16px 18px;margin-bottom:10px;cursor:pointer;--gfill:rgba(255,255,255,.66)}
.lesson-num{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--muted);background:rgba(120,120,128,.14)}
.lesson-content{flex:1;min-width:0}
.lesson-title{font:600 17px/1.2 -apple-system,"SF Pro Text",sans-serif;letter-spacing:-.2px}
.lesson-theme{font-size:14px;color:var(--muted);margin-top:3px}
.lesson-mark{flex:none}
.segw{display:flex;justify-content:center;padding:4px 0 10px}
.date-row{display:flex;align-items:center;justify-content:space-between;border-radius:999px;padding:5px;margin-bottom:14px;--gfill:rgba(255,255,255,.66)}
.date-row .round{width:44px;height:44px;font-size:20px;color:var(--muted);--gfill:rgba(255,255,255,.7)}
.date-label{position:relative;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;padding:6px 10px}
.term-pill{background:rgba(10,132,255,.14);color:var(--accent);font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.profile-card{border-radius:40px;padding:26px 20px;text-align:center;margin:14px 0 18px;--gfill:rgba(255,255,255,.66)}
.profile-avatar{width:76px;height:76px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;font-size:28px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),#5ac8fa);box-shadow:0 8px 20px rgba(10,132,255,.35)}
.profile-name{font:700 22px/1.2 -apple-system,"SF Pro Display",sans-serif;letter-spacing:-.3px}
.profile-school{font-size:15px;color:var(--muted);margin-top:4px}
.settings-list{border-radius:34px;overflow:hidden;--gfill:rgba(255,255,255,.66)}
.settings-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;padding:16px 20px;font-size:17px;font-weight:500;color:#111;position:relative}
.settings-item+.settings-item::before{content:"";position:absolute;left:54px;right:0;top:0;height:1px;background:rgba(60,60,67,.12)}
.settings-item:active{background:rgba(60,60,67,.06)}
.settings-item .i{font-size:22px;color:var(--accent)}
.settings-item.danger,.settings-item.danger .i{color:var(--bad)}

/* ===== шит ===== */
#dim{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.34);opacity:0;pointer-events:none;transition:opacity .35s}
#dim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1001;max-height:92%;overflow-y:auto;border-radius:36px 36px 0 0;background:rgba(242,242,247,.88);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);
 transform:translateY(105%);transition:transform .5s cubic-bezier(.32,.72,0,1);box-shadow:0 -10px 40px rgba(0,0,0,.2);padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 28px);pointer-events:none;max-width:800px;margin:0 auto}
#sheet.on{transform:none;pointer-events:auto}
#sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:rgba(60,60,67,.25);margin:0 auto 10px}
.modal-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.modal-title{font:700 26px/1.15 -apple-system,"SF Pro Display",sans-serif;letter-spacing:-.4px;padding-top:4px}
.modal-close{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#111;--gfill:rgba(255,255,255,.7)}
.dg{background:#fff;border-radius:28px;overflow:hidden;margin-bottom:14px}
.detail-row{padding:13px 18px}
.detail-row+.detail-row{border-top:1px solid rgba(60,60,67,.12)}
.detail-label{font-size:13px;color:var(--muted);margin-bottom:5px}
.detail-value{font-size:17px;line-height:1.35}
.detail-marks{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.weight-pill{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:32px;padding:0 12px;border-radius:16px;background:#111;color:#fff;font-weight:700;font-size:15px}
.help-btn{height:32px;padding:0 14px;border-radius:16px;font-size:14px;font-weight:600;color:var(--accent);--gfill:rgba(10,132,255,.1)}

/* ===== алерты ===== */
#alert{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;padding:24px}
#alert.on{display:flex}
.al-dim{position:absolute;inset:0;background:rgba(0,0,0,.34);animation:af .3s ease both}
#alert.out .al-dim{animation:afo .2s ease both}
.al-card{--gfill:rgba(246,246,246,.84);width:min(100%,300px);border-radius:38px;padding:22px 14px 14px;box-shadow:0 24px 60px rgba(0,0,0,.28);animation:ain .45s cubic-bezier(.2,.9,.25,1) both}
#alert.out .al-card{animation:aout .2s ease-in both}
.al-t{margin:0 8px 8px;font-size:17px;font-weight:600;line-height:1.3}
.al-m{margin:0 8px 20px;font-size:17px;line-height:1.35}
.al-b{display:flex;flex-direction:column;gap:8px}
.al-btn{display:block;width:100%;height:48px;border-radius:999px;background:rgba(0,0,0,.075);color:#000;font-size:17px;font-weight:600}
.al-btn.default{background:var(--accent);color:#fff}.al-btn.destructive{color:#ff3b40}
@keyframes af{from{opacity:0}to{opacity:1}}@keyframes afo{to{opacity:0}}
@keyframes ain{from{opacity:0;transform:scale(1.14)}to{opacity:1;transform:none}}
@keyframes aout{to{opacity:0;transform:scale(.94)}}

/* ===== таббар ===== */
#tabbarWrap{position:fixed;left:0;right:0;margin:0 auto;bottom:max(8px,calc(env(safe-area-inset-bottom,0px) - 13px));width:min(calc(100% - 24px),var(--tb-max-width,368px));height:var(--tb-height);z-index:30;pointer-events:none}
#tabbar{--lit:0;position:absolute;inset:0;padding:var(--tb-pad);border-radius:calc(var(--tb-height)/2);display:flex;touch-action:none;cursor:pointer;pointer-events:auto}
#tabbar::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.9),rgba(255,255,255,0) 55%);opacity:calc(var(--lit,0)*.45)}
.tb{position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;color:#000;pointer-events:none}
.tb-icon{font-size:25px;line-height:1;transition:transform .45s cubic-bezier(.3,1.7,.5,1);display:inline-flex}
.tb-label{font-size:11px;font-weight:500;line-height:1;opacity:.8}
.tb.on{color:var(--accent)}.tb.on .tb-icon{transform:scale(1.1)}.tb.on .tb-label{opacity:1}
.tb-active-layer{position:absolute;inset:0;pointer-events:none;z-index:2;background:rgba(255,255,255,.97);border-radius:inherit}
.tb-active-inner{position:absolute;left:var(--tb-pad);top:var(--tb-pad);height:calc(var(--tb-height) - 2*var(--tb-pad));display:flex}
.tb-active-inner .tb,.tb-ct .tb{flex:none;color:var(--accent)}
.tb-active-inner .tb-icon,.tb-ct .tb-icon{transform:scale(1.1);filter:drop-shadow(-1.2px 0 rgba(255,196,0,.7)) drop-shadow(1.2px 0 rgba(110,70,255,.55))}
.tb-active-inner .tb-label,.tb-ct .tb-label{opacity:1;text-shadow:-1.3px 0 rgba(255,196,0,.75),1.3px 0 rgba(110,70,255,.6)}
.tb-bubble{position:absolute;left:0;top:0;height:calc(var(--tb-height) - 2*var(--tb-pad));border-radius:calc((var(--tb-height) - 2*var(--tb-pad))/2);pointer-events:none;will-change:transform;z-index:31;--lit:0;--rest:1;background:rgba(120,120,128,calc(.2*var(--rest,1)))}
.tb-bubble.idle .tb-lens,.tb-bubble.idle .tb-ring,.sg-bub.idle .tb-lens,.sg-bub.idle .tb-ring{display:none}
.tb-ring{position:absolute;inset:0;border-radius:inherit;overflow:hidden;opacity:var(--lit);background:rgba(255,255,255,.98);-webkit-mask-image:radial-gradient(closest-side,transparent 64%,#000 90%,transparent 100%);mask-image:radial-gradient(closest-side,transparent 64%,#000 90%,transparent 100%)}
.tb-ct{position:absolute;left:0;top:0;height:100%;display:flex;will-change:transform;filter:blur(.5px)}
.tb-lens{position:absolute;inset:0;border-radius:inherit;opacity:var(--lit);-webkit-backdrop-filter:blur(3px) saturate(1.4);backdrop-filter:blur(3px) saturate(1.4);
 -webkit-mask-image:radial-gradient(closest-side,transparent 58%,#000 100%);mask-image:radial-gradient(closest-side,transparent 58%,#000 100%);
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),inset 0 9px 11px -6px #fff,inset 0 -9px 11px -6px #fff,inset 0 0 18px rgba(255,255,255,.5),0 4px 14px rgba(0,0,0,.14)}
.tb-lens::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(60,60,67,.3) 35%,rgba(60,60,67,.3) 65%,rgba(255,255,255,.95));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

/* ===== сегмент-пикер ===== */
.seg{--sh:44px;--sp:3px;position:relative;display:flex;height:var(--sh);padding:var(--sp);border-radius:calc(var(--sh)/2);touch-action:none;cursor:pointer;will-change:transform;width:max-content;max-width:100%}
.sg{position:relative;z-index:1;flex:none;display:flex;align-items:center;justify-content:center;background:none;color:#000;font:500 15px/1 -apple-system,"SF Pro Text",sans-serif;padding:0 2px;pointer-events:none;white-space:nowrap}
.sg-act{position:absolute;inset:0;pointer-events:none;z-index:2;background:rgba(255,255,255,.97);border-radius:inherit;opacity:0}
.sg-ct{position:absolute;left:var(--sp);top:var(--sp);display:flex;will-change:transform}
.sg-ct .sg,.tb-ct .sg{height:100%;color:#000;text-shadow:-1.2px 0 rgba(255,196,0,.75),1.2px 0 rgba(110,70,255,.6)}
.sg-bub{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;z-index:31;--lit:0;--rest:1;background:rgba(120,120,128,calc(.2*var(--rest,1)))}
</style>
</head>
<body>
<div id="login">
  <form class="login-card glass" id="loginForm">
    <div class="logo glass"><span data-ic="logo"></span></div>
    <h1>Электронный журнал</h1>
    <p>Лицей информационных технологий №28</p>
    <div class="grp"><input id="lg" placeholder="Логин" autocomplete="username" autocapitalize="none" autofocus><input id="pw" type="password" placeholder="Пароль" autocomplete="current-password"></div>
    <button class="btn jl" id="loginBtn" type="submit">Войти</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app" class="hidden">
  <header class="top" id="mainHeader">
    <div><div class="greeting">Привет!</div><div class="cache-note" id="cacheNote"></div></div>
    <button class="round glass jl" id="refresh" aria-label="Обновить"><span data-ic="sync"></span></button>
  </header>
  <main id="content"></main>
  <div id="tabbarWrap">
    <nav id="tabbar" class="glass" aria-label="Вкладки"></nav>
    <div class="tb-bubble"><div class="tb-ring"><div class="tb-ct"></div></div><div class="tb-lens"></div></div>
  </div>
</div>

<div id="dim"></div>
<div id="sheet"></div>
<div id="alert" aria-hidden="true"></div>

<script>
const API = '/api/proxy?path=';
const CACHE_TTL_MS = 10 * 60 * 1000;
const state = { cookie:'', userId:0, journalId:0, user:'', cls:0, uchId:0, uchYear:0, tab:'today', subjects:{}, teachers:{}, currentTerm:1, dairyDate:new Date(), fullDairy:[], lessonWeights:{}, marksList:null };
let termRanges = null, dairyPromise = null, weightsPromise = null, termSeg = null;

/* ===== иконки ===== */
/* ВСТАВЬ СВОИ SVG (с currentColor) */

class Sp{constructor(x=0,k=220,c=24){this.x=x;this.v=0;this.t=x;this.k=k;this.c=c}

const anims = new Set(); let raf = 0, lastT = 0;

function jelly(el,o={}){

  const all=[sx,sy,tx,ty,lit];let down=false,r0=null,vx=0,vy=0,lx=0,ly=0,lt=0;
  const apply=()=>{el.style.transform=`translate3d(${tx.x.toFixed(2)}px,${ty.x.toFixed(2)}px,0) scale(${sx.x.toFixed(4)},${sy.x.toFixed(4)})`;el.style.setProperty('--lit',cl(lit.x,0,1.15).toFixed(3))};
  const api={tick(dt){for(let n=0;n<2;n++)all.forEach(s=>s.step(dt/2));if(down){vx*=.9;vy*=.9;aim()}apply();
    const busy=down||!all.every(s=>s.rest);if(!busy)el.style.willChange='';return busy}};
  function aim(){const sp=cl(Math.hypot(vx,vy)/3500,0,o.stretch??.09),ax=Math.abs(vx),ay=Math.abs(vy),k=ax+ay+1e-6;sx.t=pr*(1+sp*ax/k-sp*.55*ay/k);sy.t=pr*(1+sp*ay/k-sp*.55*ax/k)}

    r0=el.getBoundingClientRect();lx=e.clientX;ly=e.clientY;lt=performance.now();vx=vy=0;sx.t=sy.t=pr;lit.t=1;tx.t=ty.t=0;mark(e);run(api)});
  el.addEventListener('pointermove',e=>{if(!down)return;const now=performance.now(),dt=Math.max(1,now-lt)/1000;
    vx=vx*.55+((e.clientX-lx)/dt)*.45;vy=vy*.55+((e.clientY-ly)/dt)*.45;lx=e.clientX;ly=e.clientY;lt=now;
    const cx=r0.left+r0.width/2,cy=r0.top+r0.height/2,lim=Math.min(r0.width,r0.height)*(o.lim??.17),fl=o.follow??.25;
    tx.t=cl((e.clientX-cx)*fl,-lim,lim);ty.t=cl((e.clientY-cy)*fl,-lim,lim);mark(e)});
  const up=()=>{if(!down)return;down=false;sx.t=sy.t=1;tx.t=ty.t=0;lit.t=0;run(api)};

  function mark(e){if(!r0)return;el.style.setProperty('--mx',cl((e.clientX-r0.left)/r0.width*100,0,100)+'%');el.style.setProperty('--my',cl((e.clientY-r0.top)/r0.height*100,0,100)+'%')}
}
function glassify(el,opt={}){
  if(el._gl)return;el._gl=1;
  [...el.childNodes].forEach(nd=>{if(nd.nodeType===3&&nd.textContent.trim()){const sp=document.createElement('span');sp.className='gt';nd.replaceWith(sp);sp.appendChild(nd)}});
  if(opt.light){el.insertAdjacentHTML('beforeend','<i class="gf"></i>');return}
  el.insertAdjacentHTML('afterbegin','<i class="gb gb1"></i><i class="gb gb2"></i>');

}

function makeSeg(host,labels,onSelect,opt={}){
  const PAD=3,n=labels.length,eh=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const bar=document.createElement('div');bar.className='seg glass nog';host.appendChild(bar);glassify(bar);
  labels.forEach(l=>bar.insertAdjacentHTML('beforeend',`<button class="sg" type="button" tabindex="-1">${eh(l)}</button>`));
  const btns=$$('.sg',bar);
  const act=document.createElement('div');act.className='sg-act';act.innerHTML='<div class="sg-ct"></div>';bar.appendChild(act);
  const ct=$('.sg-ct',act);ct.innerHTML=labels.map(l=>`<span class="sg">${eh(l)}</span>`).join('');
  const bub=document.createElement('div');bub.className='sg-bub idle';bub.innerHTML='<div class="tb-ring"><div class="tb-ct"></div></div><div class="tb-lens"></div>';bar.appendChild(bub);
  const ct2=$('.tb-ct',bub);ct2.innerHTML=ct.innerHTML;
  let active=opt.start||0,BH=34,down=false,rel=0,until=0,xs=[0],ws=[1],total=1;
  const pos=new Sp(active,TB_CFG.springPos.k,TB_CFG.springPos.c),lit=new Sp(0,TB_CFG.springLit.k,TB_CFG.springLit.c);
  const geom=p=>{const index=cl(p,0,n-1),i=Math.floor(index),i2=Math.min(i+1,n-1),f=index-i;return{x:xs[i]+(xs[i2]-xs[i])*f,w:ws[i]+(ws[i2]-ws[i])*f}};
  function measure(){
    btns.forEach(b=>b.style.width='auto');
    const nat=btns.map(b=>b.scrollWidth);ws=nat.map(v=>Math.ceil(v+(opt.pad||24)));
    xs=[];let acc=0;ws.forEach(w=>{xs.push(acc);acc+=w});xs.push(acc);total=acc;
    [btns,$$('.sg',ct),$$('.sg',ct2)].forEach(arr=>arr.forEach((b,i)=>b.style.width=ws[i]+'px'));
    bar.style.width=(total+PAD*2)+'px';BH=bar.clientHeight-2*PAD;
    bub.style.height=BH+'px';bub.style.borderRadius=(BH/2)+'px';ct.style.height=BH+'px';ct2.style.height=BH+'px';paint();
  }
  function paint(){
    const g=geom(pos.x),tw=g.w,X=g.x,sv=Math.abs(pos.v),sx=1+cl(sv*.1,0,.5)+lit.x*.4,sy=1-cl(sv*.03,0,.1)+lit.x*.32;
    const H=bar.clientHeight,W=bar.clientWidth,cw=tw*sx,chh=BH*sy,l=PAD+X+tw/2-cw/2,t=H/2-chh/2,b=H-t-chh;
    act.style.clipPath=`inset(${t}px ${W-l-cw}px ${b}px ${l}px round ${chh/2}px)`;act.style.opacity=cl(lit.x,0,1);
    const org=`${X+tw/2}px ${BH/2}px`;
    ct.style.transformOrigin=org;ct.style.transform=`scale(${(1+lit.x*.12).toFixed(3)})`;
    ct2.style.transformOrigin=org;ct2.style.transform=`translate3d(${(-X).toFixed(2)}px,0,0) scale(${(1+lit.x*.22).toFixed(3)})`;
    bub.style.width=tw+'px';bub.style.transform=`translate3d(${(PAD+X).toFixed(2)}px,${PAD}px,0) scale(${sx.toFixed(3)},${sy.toFixed(3)})`;
    bub.classList.toggle('idle',lit.x<.01);bub.style.setProperty('--lit',cl(lit.x,0,1).toFixed(3));bub.style.setProperty('--rest',cl(1-lit.x*5,0,1).toFixed(3));
  }
  const anim={tick(dt){if(rel&&Math.abs(pos.t-pos.x)<.1&&Math.abs(pos.v)<1.2){lit.t=0;rel=0}
    for(let k=0;k<2;k++){pos.step(dt/2);lit.step(dt/2)}paint();return down||performance.now()<until||!(pos.rest&&lit.rest)}};
  const idxAt=x=>{const r=bar.getBoundingClientRect(),k=r.width/bar.offsetWidth||1,px=(x-r.left)/k-PAD;
    const c=ws.map((w,i)=>xs[i]+w/2);if(px<=c[0])return 0;if(px>=c[n-1])return n-1;let i=0;while(i<n-2&&px>=c[i+1])i++;return i+(px-c[i])/(c[i+1]-c[i])};
  const pick=i=>{if(i===active)return;active=i;onSelect&&onSelect(i);if(navigator.vibrate)try{navigator.vibrate(8)}catch(_){}};
  bar.addEventListener('pointerdown',e=>{if(e.button>0)return;down=true;rel=0;until=performance.now()+1200;try{bar.setPointerCapture(e.pointerId)}catch(_){}
    lit.t=1;pos.t=idxAt(e.clientX);pick(Math.round(pos.t));run(anim)});
  bar.addEventListener('pointermove',e=>{if(!down)return;pos.t=idxAt(e.clientX);pick(Math.round(pos.t));run(anim)});
  const end=()=>{if(!down)return;down=false;rel=1;pos.t=active;until=performance.now()+1200;run(anim)};
  bar.addEventListener('pointerup',end);bar.addEventListener('pointercancel',end);

/* ===== утилиты ===== */
async function sha1Hex(str){const buf=new TextEncoder().encode(str);const h=await crypto.subtle.digest('SHA-1',buf);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}
function today(){const d=new Date();const p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`;}
function parseAvers(t){if(!t)return null;try{return new Function('return ('+t+');')();}catch{return t;}}
function extEscape(s){return Array.from(String(s)).map(ch=>{const c=ch.codePointAt(0);return c<128?ch:'%u'+c.toString(16).toUpperCase().padStart(4,'0');}).join('');}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const toNum=v=>{const n=parseFloat(String(v).replace(',','.'));return Number.isFinite(n)&&n>0?n:1};
const dkey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function parseAversDate(v){if(v instanceof Date)return v;const m=String(v).match(/Date\((\d+),(\d+),(\d+)/);if(m)return new Date(+m[1],+m[2],+m[3]);return new Date(/^\d{4}-\d{2}-\d{2}$/.test(v)?v+'T00:00:00':v);}
function formatDate(d){const months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];return `${d.getDate()} ${months[d.getMonth()]}`;}
function getTermName(t){return {1:'I четв.',2:'II четв.',3:'III четв.',4:'IV четв.'}[t]||'';}
async function api(path,opts={}){
  const url=API+encodeURIComponent(path);
  const res=await fetch(url,{method:opts.method||'GET',headers:{'X-Avers-Cookie':state.cookie,...(opts.body?{'Content-Type':'application/x-www-form-urlencoded'}:{})},body:opts.body||null});
  if(!res.ok)throw new Error(`Ошибка ${res.status}`);
  return parseAvers(await res.text());
}

/* ===== кэш (без изменений) ===== */
function cacheKey(name){return `avers_cache_${state.userId}_${name}`;}
function cacheGet(name){try{const raw=localStorage.getItem(cacheKey(name));if(!raw)return null;const{ts,data}=JSON.parse(raw);if(Date.now()-ts>CACHE_TTL_MS)return null;return{data,ts};}catch{return null;}}
function cacheSet(name,data){try{localStorage.setItem(cacheKey(name),JSON.stringify({ts:Date.now(),data}));}catch{}}
function cacheClearAll(){try{Object.keys(localStorage).filter(k=>k.startsWith(`avers_cache_${state.userId}_`)).forEach(k=>localStorage.removeItem(k));}catch{}}
function showCacheNote(ts){const el=$('#cacheNote');if(!el)return;if(!ts){el.textContent='';return;}const mins=Math.round((Date.now()-ts)/60000);el.textContent=mins<1?'Обновлено только что':`Кэш (${mins} мин. назад)`;}

      api('/act/GET_STUDENT_SUBJECTS',{method:'POST',body:`student=${state.userId}&uchYear=${state.uchYear}&cls=${state.cls}`}),

    if(Array.isArray(teachers))teachers.forEach(t=>state.teachers[t[0]]=t[1]);
    await loadTermRanges();
    const now=new Date();const currentT=termRanges.find(t=>now>=t.start&&now<=t.end);

/* ===== загрузка данных (без изменений) ===== */
async function loadTermRanges(){
  if(termRanges)return termRanges;
  const cached=cacheGet('term_ranges');
  if(cached){termRanges=cached.data.map(t=>({...t,start:new Date(t.start),end:new Date(t.end)}));return termRanges;}
  const ids=[360000,360001,360002,360003];
  const body=`uchYear=${state.uchYear}&`+ids.map(i=>`ids=${i}`).join('&');
  const data=await api('/act/GET_JOURNAL_PERIODS_INFO',{method:'POST',body});
  if(!Array.isArray(data)||!data.length){termRanges=[];return termRanges;}
  termRanges=data.map((r,idx)=>({id:r[0],term:idx+1,start:parseAversDate(r[1]),end:parseAversDate(r[2])}));
  cacheSet('term_ranges',termRanges.map(t=>({...t,start:t.start.toISOString(),end:t.end.toISOString()})));
  return termRanges;
}
function getTermByDate(date){if(!termRanges)return 0;for(const t of termRanges){if(date>=t.start&&date<=t.end)return t.term;}return 0;}
async function fetchDairy(){
  if(state.fullDairy.length>0)return state.fullDairy;
  if(dairyPromise)return dairyPromise;
  const cached=cacheGet('full_dairy');
  if(cached&&cached.data.length>0){state.fullDairy=cached.data;return state.fullDairy;}
  dairyPromise=(async()=>{
    const start='01.09.'+state.uchYear,end='31.05.'+(state.uchYear+1);
    const data=await api('/act/GET_STUDENT_DAIRY',{method:'POST',body:`pClassesIds=${state.cls}&student=${state.journalId}&cls=${state.cls}&begin_dt=${start}&end_dt=${end}`});
    state.fullDairy=data;cacheSet('full_dairy',data);dairyPromise=null;return data;
  })();
  return dairyPromise;
}
async function fetchWeights(){
  if(Object.keys(state.lessonWeights).length>0)return state.lessonWeights;
  if(weightsPromise)return weightsPromise;
  const cached=cacheGet('lesson_weights_v2');
  if(cached&&Object.keys(cached.data).length>0){state.lessonWeights=cached.data;return state.lessonWeights;}
  weightsPromise=(async()=>{
    const yearStart=`01.09.${state.uchYear}`,yearEnd=`31.05.${state.uchYear+1}`;
    const body=`cls=${state.cls}&period_begin=${yearStart}&period_end=${yearEnd}&student=${state.journalId}&uchYear=${state.uchYear}`;
    try{
      const lessons=await api('/act/GET_STUDENT_LESSONS',{method:'POST',body});
      if(Array.isArray(lessons)){lessons.forEach(l=>{let w=l[9];if(w===null||w===undefined)w=l[3];if(w===null||w===undefined)w=1;state.lessonWeights[l[0]]=toNum(w);});}
      cacheSet('lesson_weights_v2',state.lessonWeights);
    }catch(e){console.warn('Ошибка весов',e);}
    weightsPromise=null;return state.lessonWeights;
  })();
  return weightsPromise;
}

function renderMarkChip(mark,weight,lessonId=null,subjId=null,dateStr=null){

/* --- Оценки --- */
function drawMarks(){
  const list=state.marksList;if(!list?.isConnected)return;
  const dairy=state.fullDairy,weights=state.lessonWeights;
  const selectedT=termRanges.find(t=>t.term===state.currentTerm);
  const subjectData={};
  dairy.forEach(r=>{
    if(!selectedT||!r[5])return;const d=parseAversDate(r[0]);
    if(d<selectedT.start||d>selectedT.end)return;
    const id=r[2];if(!subjectData[id])subjectData[id]={marks:[]};
    subjectData[id].marks.push({mark:String(r[5]),weight:weights[r[1]]||1,lessonId:r[1],date:formatDate(d)});
  });
  const sorted=Object.keys(subjectData).sort((a,b)=>(state.subjects[a]||'').localeCompare(state.subjects[b]||''));
  if(!sorted.length){list.innerHTML='<div class="empty">В этой четверти оценок нет</div>';return;}
  list.innerHTML=sorted.map(subjId=>{
    const data=subjectData[subjId],name=state.subjects[subjId]||`#${subjId}`;
    let num=0,den=0,count=0;
    data.marks.forEach(m=>{const v=parseFloat(m.mark);if(!isNaN(v)){num+=v*m.weight;den+=m.weight;count++;}});
    const avg=(count>=3&&den>0)?(num/den).toFixed(2):null;
    return `<div class="card glass jl" onclick="window.openSubjectDetail(${subjId}, '${name.replace(/'/g,"\\'")}')">
      <div class="subject-header"><div class="subject-name">${escapeHtml(name)}</div>${avg?`<div class="subject-avg">${avg}</div>`:''}</div>
      <div class="subject-marks">${data.marks.map(m=>renderMarkChip(m.mark,m.weight,m.lessonId,subjId,m.date)).join('')}</div></div>`;
  }).join('');
  gl(list);
}
async function renderMarks(el){

    }else $('#termSeg',el).remove();
    state.marksList=$('#marksList',el);

}

      <button class="settings-item" onclick="document.getElementById('refresh').click()">${ico('sync')}Обновить данные</button>
      <button class="settings-item danger" onclick="window.openConfirm()">${ico('out')}Выйти из аккаунта</button></div>
    <div style="text-align:center;margin:22px 0;font-size:13px;color:var(--muted)">Версия 1.0 · PWA</div>`;
}
window.openConfirm=function(){
  showAlert({title:'Выход',message:'Вы уверены, что хотите выйти из аккаунта?',buttons:[
    {label:'Выйти',style:'destructive',onClick:()=>{cacheClearAll();localStorage.removeItem('avers_session');location.reload();}},
    {label:'Отмена',style:'cancel'}]});
};

/* ===== автовход ===== */
(function(){
  const s=localStorage.getItem('avers_session');
  if(s){try{const j=JSON.parse(s);state.cookie=j.cookie;state.userId=j.userId;state.user=j.user;boot();}catch{}}
})();
</script>
</body>
</html>
