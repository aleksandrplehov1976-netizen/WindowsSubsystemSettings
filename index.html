<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Новости</title>
    <style>
        /* ===== ГЛОБАЛЬНЫЙ СБРОС (НИКАКИХ ТЕНЕЙ, СМАЙЛИКОВ, СКРУГЛЕНИЙ) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            padding: 0;
            margin: 0;
        }

        /* ===== ОБЩИЕ КНОПКИ ===== */
        button {
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
        }

        button:active {
            opacity: 0.6;
        }

        /* ===== ШАПКА ГЛАВНОГО ЭКРАНА ===== */
        .main-header {
            background: #ffffff;
            border-bottom: 1px solid #d0d0d0;
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .main-header h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #1a1a1a;
        }

        /* ===== ГЛАВНЫЙ ЭКРАН: 3 ПЛИТКИ ===== */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            background: #d0d0d0;
            margin: 0;
            padding: 0;
        }

        .grid-3 .tile {
            background: #ffffff;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 0;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: none;
        }

        .grid-3 .tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .grid-3 .tile .tile-title {
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            padding: 8px 10px;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.3;
            position: relative;
            z-index: 2;
            text-align: left;
            letter-spacing: 0.2px;
            border: none;
        }

        /* ===== ОСТАЛЬНЫЕ НОВОСТИ (СПИСОК) ===== */
        .news-list {
            padding: 0;
            margin: 0;
        }

        .news-list .list-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-bottom: 1px solid #e5e5e5;
            cursor: pointer;
            background: #ffffff;
        }

        .news-list .list-item:active {
            background: #f0f0f0;
        }

        .news-list .list-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            flex-shrink: 0;
            background: #e5e5e5;
        }

        .news-list .list-item .list-title {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.3;
            color: #1a1a1a;
        }

        .news-list .list-item .list-date {
            font-size: 12px;
            color: #777;
            margin-top: 4px;
        }

        /* ===== ДЕТАЛЬНЫЙ ЭКРАН (НОВОСТЬ) ===== */
        .detail-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 1000;
            overflow-y: auto;
            padding: 0;
            margin: 0;
        }

        .detail-screen.active {
            display: block;
        }

        /* Шапка детального экрана */
        .detail-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #ffffff;
            border-bottom: 1px solid #d0d0d0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .detail-header .back-btn {
            font-size: 28px;
            font-weight: 300;
            line-height: 1;
            color: #1a1a1a;
            padding: 0 4px;
            background: none;
            border: none;
            cursor: pointer;
        }

        .detail-header .detail-title {
            font-size: 18px;
            font-weight: 500;
            color: #1a1a1a;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Контент детального экрана */
        .detail-content {
            padding: 16px 20px 40px;
        }

        .detail-content .detail-image {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            margin-bottom: 16px;
            background: #e5e5e5;
        }

        .detail-content .detail-headline {
            font-size: 22px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 12px;
            color: #1a1a1a;
        }

        .detail-content .detail-body {
            font-size: 16px;
            line-height: 1.6;
            color: #222;
            margin-bottom: 20px;
        }

        /* Кнопка лайка */
        .like-container {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-top: 1px solid #e5e5e5;
            border-bottom: 1px solid #e5e5e5;
            margin-bottom: 20px;
        }

        .like-btn {
            font-size: 16px;
            font-weight: 500;
            color: #1a1a1a;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 12px;
            border: 1px solid #1a1a1a;
            min-width: 80px;
            text-align: center;
        }

        .like-btn.liked {
            background: #1a1a1a;
            color: #ffffff;
        }

        .like-count {
            font-size: 14px;
            color: #555;
        }

        /* ===== КОММЕНТАРИИ (Google News стиль) ===== */
        .comments-section {
            margin-top: 12px;
        }

        .comments-section .comments-title {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }

        .comment-item {
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .comment-item .comment-author {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .comment-item .comment-author span {
            font-weight: 400;
            color: #777;
            font-size: 12px;
            margin-left: 8px;
        }

        .comment-item .comment-text {
            font-size: 15px;
            color: #222;
            line-height: 1.4;
            margin-top: 4px;
        }

        .comment-item .comment-actions {
            display: flex;
            gap: 16px;
            margin-top: 6px;
            font-size: 13px;
            color: #555;
        }

        .comment-item .comment-actions button {
            background: none;
            border: none;
            color: #555;
            font-size: 13px;
            cursor: pointer;
            padding: 0;
        }

        .comment-item .comment-actions button:active {
            color: #1a1a1a;
        }

        /* Форма добавления комментария */
        .add-comment-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #e5e5e5;
        }

        .add-comment-form input {
            padding: 10px 12px;
            border: 1px solid #d0d0d0;
            font-size: 15px;
            font-family: inherit;
            background: #ffffff;
            color: #1a1a1a;
            width: 100%;
        }

        .add-comment-form .comment-row {
            display: flex;
            gap: 8px;
        }

        .add-comment-form .comment-row input:first-child {
            flex: 0 0 120px;
        }

        .add-comment-form .comment-row input:last-child {
            flex: 1;
        }

        .add-comment-form .submit-comment {
            align-self: flex-end;
            padding: 8px 20px;
            background: #1a1a1a;
            color: #ffffff;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .add-comment-form .submit-comment:active {
            opacity: 0.7;
        }

        /* ===== ЗАГРУЗКА ===== */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #777;
            font-size: 15px;
        }

        /* ===== ОШИБКА ===== */
        .error {
            text-align: center;
            padding: 40px 20px;
            color: #b00020;
        }

        .error button {
            margin-top: 12px;
            padding: 8px 24px;
            background: #1a1a1a;
            color: #ffffff;
            border: none;
            font-size: 14px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 480px) {
            .grid-3 .tile .tile-title {
                font-size: 11px;
                padding: 6px 8px;
            }
            .news-list .list-item img {
                width: 60px;
                height: 60px;
            }
            .detail-content .detail-headline {
                font-size: 19px;
            }
            .detail-header .detail-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================ -->
    <!--  ГЛАВНЫЙ ЭКРАН                                              -->
    <!-- ============================================================ -->
    <div id="mainScreen">
        <div class="main-header">
            <h1>Новости</h1>
        </div>

        <!-- 3 плитки (заполняются скриптом) -->
        <div class="grid-3" id="tilesContainer"></div>

        <!-- Список остальных новостей -->
        <div class="news-list" id="listContainer"></div>
    </div>

    <!-- ============================================================ -->
    <!--  ДЕТАЛЬНЫЙ ЭКРАН                                            -->
    <!-- ============================================================ -->
    <div class="detail-screen" id="detailScreen">
        <div class="detail-header">
            <button class="back-btn" id="backBtn">←</button>
            <span class="detail-title" id="detailTitle">Новость</span>
        </div>

        <div class="detail-content" id="detailContent">
            <!-- Заполняется скриптом -->
        </div>
    </div>

    <!-- ============================================================ -->
    <!--  СКРИПТ                                                      -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        //  КОНФИГУРАЦИЯ
        // ============================================================
        const API_BASE = 'https://script.google.com/macros/s/AKfycbzoUIyPjK6So3sVlM3QCvabCExZLjuqI4Jn_cNlpx_eOjRWbNu-qZYFOw902OjzWKMKFg/exec';

        // ============================================================
        //  СОСТОЯНИЕ
        // ============================================================
        let allNews = [];
        let currentNews = null;

        // ============================================================
        //  ЗАГРУЗКА НОВОСТЕЙ
        // ============================================================
        async function loadNews() {
            try {
                const url = `${API_BASE}?action=getNews`;
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                if (!data.success || !data.data || data.data.length === 0) {
                    document.getElementById('tilesContainer').innerHTML = '<div style="grid-column:1/-1;padding:40px;text-align:center;color:#777;">Новостей пока нет</div>';
                    document.getElementById('listContainer').innerHTML = '';
                    return;
                }

                allNews = data.data;
                renderMainScreen(allNews);
            } catch (error) {
                document.getElementById('tilesContainer').innerHTML = `
                    <div style="grid-column:1/-1;padding:40px;text-align:center;color:#b00020;">
                        Ошибка: ${error.message}
                        <br><br>
                        <button onclick="loadNews()" style="padding:8px 24px;background:#1a1a1a;color:#fff;border:none;font-size:14px;">Повторить</button>
                    </div>
                `;
                document.getElementById('listContainer').innerHTML = '';
            }
        }

        // ============================================================
        //  ОТРИСОВКА ГЛАВНОГО ЭКРАНА
        // ============================================================
        function renderMainScreen(news) {
            // ТОП-3 для плиток
            const top3 = news.slice(0, 3);
            const rest = news.slice(3);

            // === ПЛИТКИ ===
            let tilesHtml = '';
            for (const item of top3) {
                const img = item.imageUrl ? item.imageUrl : '';
                tilesHtml += `
                    <div class="tile" onclick="openDetail(${item.id})">
                        <img src="${escapeHtml(img)}" alt="" onerror="this.style.display='none'">
                        <div class="tile-title">${escapeHtml(item.title)}</div>
                    </div>
                `;
            }
            document.getElementById('tilesContainer').innerHTML = tilesHtml;

            // === СПИСОК ОСТАЛЬНЫХ ===
            let listHtml = '';
            for (const item of rest) {
                const img = item.imageUrl ? item.imageUrl : '';
                listHtml += `
                    <div class="list-item" onclick="openDetail(${item.id})">
                        <img src="${escapeHtml(img)}" alt="" onerror="this.style.display='none'">
                        <div>
                            <div class="list-title">${escapeHtml(item.title)}</div>
                            <div class="list-date">${escapeHtml(item.date)}</div>
                        </div>
                    </div>
                `;
            }
            document.getElementById('listContainer').innerHTML = listHtml || '<div style="padding:20px;text-align:center;color:#777;">Это все новости</div>';
        }

        // ============================================================
        //  ОТКРЫТЬ ДЕТАЛЬНЫЙ ЭКРАН
        // ============================================================
        async function openDetail(newsId) {
            const news = allNews.find(n => n.id === newsId);
            if (!news) return;

            currentNews = news;
            const screen = document.getElementById('detailScreen');
            const title = document.getElementById('detailTitle');
            const content = document.getElementById('detailContent');

            // Заголовок в шапке
            title.textContent = news.title;

            // === КОНТЕНТ ===
            const img = news.imageUrl ? news.imageUrl : '';

            // Счетчик лайков (локальный)
            const likes = localStorage.getItem(`likes_${news.id}`) ? parseInt(localStorage.getItem(`likes_${news.id}`), 10) : 0;

            content.innerHTML = `
                <img class="detail-image" src="${escapeHtml(img)}" alt="" onerror="this.style.display='none'">
                <div class="detail-headline">${escapeHtml(news.title)}</div>
                <div class="detail-body">${escapeHtml(news.text)}</div>

                <div class="like-container">
                    <button class="like-btn" id="likeBtn" onclick="toggleLike()">Лайк</button>
                    <span class="like-count" id="likeCount">${likes}</span>
                </div>

                <div class="comments-section" id="commentsSection">
                    <div class="comments-title">Комментарии</div>
                    <div id="commentsList">Загрузка...</div>

                    <div class="add-comment-form">
                        <div class="comment-row">
                            <input type="text" id="commentName" placeholder="Имя" value="Аноним">
                            <input type="text" id="commentText" placeholder="Написать комментарий...">
                        </div>
                        <button class="submit-comment" onclick="submitComment()">Отправить</button>
                    </div>
                </div>
            `;

            // Показываем экран
            screen.classList.add('active');

            // Загружаем комментарии
            loadComments(newsId);

            // Обновляем состояние лайка
            updateLikeButton();
        }

        // ============================================================
        //  ЗАГРУЗКА КОММЕНТАРИЕВ
        // ============================================================
        async function loadComments(newsId) {
            const list = document.getElementById('commentsList');
            if (!list) return;

            try {
                const url = `${API_BASE}?action=getComments&newsId=${newsId}`;
                const response = await fetch(url);
                const data = await response.json();

                if (!data.success || !data.data || data.data.length === 0) {
                    list.innerHTML = '<div style="color:#777;padding:8px 0;">Нет комментариев</div>';
                    return;
                }

                let html = '';
                for (const c of data.data) {
                    html += `
                        <div class="comment-item">
                            <div class="comment-author">
                                ${escapeHtml(c.name)}
                                <span>${escapeHtml(c.date)}</span>
                            </div>
                            <div class="comment-text">${escapeHtml(c.text)}</div>
                            <div class="comment-actions">
                                <button onclick="replyComment('${escapeHtml(c.name)}')">Ответить</button>
                                <button onclick="likeComment()">Нравится</button>
                            </div>
                        </div>
                    `;
                }
                list.innerHTML = html;
            } catch (error) {
                list.innerHTML = '<div style="color:#b00020;padding:8px 0;">Ошибка загрузки</div>';
            }
        }

        // ============================================================
        //  ДОБАВЛЕНИЕ КОММЕНТАРИЯ
        // ============================================================
        async function submitComment() {
            if (!currentNews) return;
            const name = document.getElementById('commentName').value.trim() || 'Аноним';
            const text = document.getElementById('commentText').value.trim();
            if (!text) {
                alert('Напишите текст комментария');
                return;
            }

            const btn = document.querySelector('.submit-comment');
            btn.disabled = true;
            btn.textContent = '...';

            try {
                const url = `${API_BASE}?action=addComment&newsId=${currentNews.id}&name=${encodeURIComponent(name)}&text=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.success) {
                    document.getElementById('commentText').value = '';
                    loadComments(currentNews.id);
                } else {
                    alert('Ошибка: ' + (data.error || 'Неизвестная ошибка'));
                }
            } catch (error) {
                alert('Ошибка: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Отправить';
            }
        }

        // ============================================================
        //  ЛАЙК
        // ============================================================
        function toggleLike() {
            if (!currentNews) return;
            const key = `likes_${currentNews.id}`;
            let count = localStorage.getItem(key) ? parseInt(localStorage.getItem(key), 10) : 0;
            count += 1;
            localStorage.setItem(key, count);
            updateLikeButton();
        }

        function updateLikeButton() {
            if (!currentNews) return;
            const btn = document.getElementById('likeBtn');
            const count = document.getElementById('likeCount');
            if (!btn || !count) return;
            const val = localStorage.getItem(`likes_${currentNews.id}`) ? parseInt(localStorage.getItem(`likes_${currentNews.id}`), 10) : 0;
            count.textContent = val;
            btn.textContent = val > 0 ? 'Лайкнут' : 'Лайк';
            btn.classList.toggle('liked', val > 0);
        }

        // ============================================================
        //  ЗАГЛУШКИ ДЛЯ КОММЕНТАРИЕВ (Google News стиль)
        // ============================================================
        function replyComment(name) {
            const input = document.getElementById('commentText');
            if (input) {
                input.value = `@${name} `;
                input.focus();
            }
        }

        function likeComment() {
            // Просто визуальный фидбек — без сохранения
            const btn = event.target;
            btn.textContent = 'Нравится ❤️';
            setTimeout(() => { btn.textContent = 'Нравится'; }, 1000);
        }

        // ============================================================
        //  ЗАКРЫТЬ ДЕТАЛЬНЫЙ ЭКРАН
        // ============================================================
        document.getElementById('backBtn').addEventListener('click', function() {
            document.getElementById('detailScreen').classList.remove('active');
        });

        // Закрытие по свайпу вниз (для мобилок)
        let startY = 0;
        document.getElementById('detailScreen').addEventListener('touchstart', function(e) {
            startY = e.touches[0].clientY;
        });
        document.getElementById('detailScreen').addEventListener('touchmove', function(e) {
            const delta = e.touches[0].clientY - startY;
            if (delta > 80 && this.scrollTop === 0) {
                this.classList.remove('active');
            }
        });

        // ============================================================
        //  ESCAPE HTML
        // ============================================================
        function escapeHtml(str) {
            if (!str) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(str).replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // ============================================================
        //  ЗАПУСК
        // ============================================================
        window.onload = function() {
            loadNews();
        };
    </script>

</body>
</html>
